name: Agent Closure Tools Link Patch

on:
  push:
    branches:
      - agent-closure-tools-link

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-closure-tools-link
      - name: Replace exactly one Tools card link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public/tools/index.html")
          text = path.read_text(encoding="utf-8")
          old = '<article class="rv-other-card"><h3>Agent Closure Inspector</h3><p>Inspect residual consequences that prevent a bounded agent-closure claim from becoming CLOSED.</p><a href="/tools/agent-closure/">Open Inspector →</a></article>'
          new = '<article class="rv-other-card"><h3>Agent Closure Inspector</h3><p>Inspect residual consequences that prevent a bounded agent-closure claim from becoming CLOSED.</p><a href="/tools/agent-closure-inspector/">Open Inspector →</a></article>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Agent Closure Tools card, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          test "$(git diff --numstat -- public/tools/index.html)" = $'1\t1\tpublic/tools/index.html'
          git diff --check
      - name: Commit exact one-line patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/tools/index.html
          git commit -m "Route Tools card to current Agent Closure Inspector"
          git push origin HEAD:agent-closure-tools-link
