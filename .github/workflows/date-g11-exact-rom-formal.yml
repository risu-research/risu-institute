name: DATE G11 exact two-word ROM full-CPU formal audit
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths:
      - '.github/workflows/date-g11-exact-rom-formal.yml'
      - 'research/date-g11-exact-rom-formal/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install original Yosys and pin solver version used in independent reproduction
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y yosys python3-pip gcc
          python3 -m pip install --user --quiet 'z3-solver==4.13.3.0'
          LIBPATH="$(python3 - <<'PY'
          import z3,pathlib
          assert z3.get_version()==(4,13,3,0),z3.get_version()
          d=pathlib.Path(z3.__file__).resolve().parent/'lib'
          libs=sorted(x for x in d.glob('libz3.so*') if x.is_file())
          assert libs,('Z3 shared library not found',d)
          print(libs[0])
          PY
          )"
          gcc -O2 "$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/z3_smt_driver.c" "$LIBPATH" -Wl,-rpath,"$(dirname "$LIBPATH")" -o "$GITHUB_WORKSPACE/g11_z3_driver"
          yosys -V
          python3 -c 'import z3;print("PINNED_SOLVER",z3.get_version())'
      - name: Rebuild both historical full CPU models from pinned original source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-exact-rom-results"
          mkdir -p "$OUT"
          git clone --filter=blob:none https://github.com/ZipCPU/zipcpu.git /tmp/g11-z-original
          cd /tmp/g11-z-original
          git checkout --detach 128cab89f5edaae4699184f50c1334598ebe904e
          git rev-parse HEAD > "$OUT/parent_commit.txt"
          git show d511239e19be8fcc7f340a64554ea93699637e62:rtl/core/pipemem.v > /tmp/g11-child-pipemem.v
          cp rtl/core/pipemem.v /tmp/g11-parent-pipemem.v
          sha256sum /tmp/g11-{parent,child}-pipemem.v rtl/core/{zipcpu,cpuops,dblfetch,mpyop}.v bench/formal/zipcpu.ys > "$OUT/original_source_sha256.txt"
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('/tmp/g11-z-original')
          p=root/'rtl/core/zipcpu.v';s=p.read_text();a='abs_prefetch\t#(ADDRESS_WIDTH)';b='dblfetch\t#(ADDRESS_WIDTH)';assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=root/'rtl/core/cpuops.v';s=p.read_text();a='`define\tMPYOP\tabs_mpy';b='`define\tMPYOP\tmpyop';assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=root/'bench/formal/zipcpu.ys';s=p.read_text()
          for a,b in [('read_verilog -D ZIPCPU -formal abs_prefetch.v','read_verilog -D ZIPCPU -formal ../../rtl/core/dblfetch.v'),('read_verilog -D ZIPCPU -formal abs_mpy.v','read_verilog -D ZIPCPU -formal ../../rtl/core/mpyop.v')]:
              assert s.count(a)==1;s=s.replace(a,b)
          p.write_text(s)
          PY
          sha256sum rtl/core/{zipcpu,cpuops,dblfetch,mpyop}.v bench/formal/zipcpu.ys > "$OUT/controlled_formal_source_sha256.txt"
          for REV in child parent; do
            cp "/tmp/g11-$REV-pipemem.v" rtl/core/pipemem.v
            (cd bench/formal && timeout 650 yosys -s zipcpu.ys > "$OUT/$REV-yosys.log" 2>&1)
            test -s bench/formal/zipcpu.smt2
            cp bench/formal/zipcpu.smt2 "$OUT/$REV.smt2"
            sha256sum "$OUT/$REV.smt2" >> "$OUT/model_sha256.txt"
            echo "$REV original-derived CPU model built $(wc -c < "$OUT/$REV.smt2") bytes"
          done
      - name: Execute exactly matched bounded-ROM queries (one fetch anchor)
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/g11-exact-rom-results"
          GEN="$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/make_query.py"
          : > "$OUT/SUMMARY.txt"
          for CASE in child parent parent_relaxed; do
            MODEL=parent
            if [ "$CASE" = child ]; then MODEL=child; fi
            LABEL="$CASE-depth14"
            python3 "$GEN" "$OUT/$MODEL.smt2" "$OUT/$LABEL.smt2" --case "$CASE" --depth 14 --first 12 --last 12 --anchor first-fetch > "$OUT/$LABEL-provenance.log" 2>&1
            GENCODE=$?
            if [ "$GENCODE" -ne 0 ]; then
              echo "$LABEL generator_error=$GENCODE" | tee -a "$OUT/SUMMARY.txt"
              continue
            fi
            if [ "$CASE" = parent ]; then
              python3 - "$OUT/$LABEL.smt2" <<'PY'
          import sys,pathlib
          p=pathlib.Path(sys.argv[1]);s=p.read_text();assert s.count('(check-sat)')==1
          p.write_text(s.split('(check-sat)',1)[0]+'(check-sat)\n')
          PY
            fi
            sha256sum "$OUT/$LABEL.smt2" >> "$OUT/query_sha256.txt"
            timeout 80 "$GITHUB_WORKSPACE/g11_z3_driver" "$OUT/$LABEL.smt2" > "$OUT/$LABEL-solver.log" 2> "$OUT/$LABEL-stderr.log"
            SOLVER_EXIT=$?
            RESULT=$(grep -m1 -E '^(sat|unsat|unknown)$' "$OUT/$LABEL-solver.log" || true)
            echo "$LABEL exit=$SOLVER_EXIT result=${RESULT:-NO_RESULT}" | tee -a "$OUT/SUMMARY.txt"
          done
          python3 - "$OUT" <<'PY'
          import pathlib,sys,re
          p=pathlib.Path(sys.argv[1])
          expected={'child':'sat','parent':'unsat','parent_relaxed':'sat'}
          for case,result in expected.items():
              x=(p/f'{case}-depth14-solver.log').read_text().splitlines()
              assert x and x[0]==result,(case,x[:2])
              q=(p/f'{case}-depth14.smt2').read_text()
              assert q.count('(assert (= (|zipcpu_n pf_valid| s5) true))')==1
              assert q.count('(check-sat)')==1
              assert '(assert (|zipcpu_h| s12))' in q
              if result=='sat':
                  for word in ('#x14800100','#x1c800100','#x00000100'):
                      assert word in '\n'.join(x),(case,word)
          pr=(p/'parent_relaxed-depth14-solver.log').read_text()
          assert re.search(r'\(\(\|[^|]*pipemem[^|]*_a 4\| \(\|zipcpu_h domem\| s13\)\) false\)',pr), 'old assertion false must be independently observed'
          print('PASS child SAT / parent UNSAT / parent-relaxed SAT; same ROM, bounded goal and single fetch anchor; parent old assertion false at s13')
          PY
      - name: Preserve full pinned-source evidence, both models, every query and solver trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-exact-rom-fullcpu-evidence
          path: g11-exact-rom-results/
          retention-days: 30
          if-no-files-found: warn
