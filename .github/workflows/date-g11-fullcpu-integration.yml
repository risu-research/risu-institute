name: DATE G11 full CPU historical integration
on:
  push:
    branches:
      - research/date-g11-fullcpu-integration-20260919
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_full_cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source original-RTL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y yosys z3 python3
          yosys -V
          z3 -version
      - name: Reconstruct original parent and child CPU, add observation-only covers, execute
        shell: bash
        run: |
          mkdir -p date-g11-fullcpu-results
          set -u
          git clone --filter=blob:none https://github.com/ZipCPU/zipcpu.git /tmp/zipcpu-source
          cd /tmp/zipcpu-source
          git checkout --detach 128cab89f5edaae4699184f50c1334598ebe904e
          git rev-parse HEAD > "$GITHUB_WORKSPACE/date-g11-fullcpu-results/parent-commit.txt"
          git show d511239e19be8fcc7f340a64554ea93699637e62:rtl/core/pipemem.v > /tmp/child-pipemem.v
          cp rtl/core/pipemem.v /tmp/parent-pipemem.v
          sha256sum /tmp/parent-pipemem.v /tmp/child-pipemem.v | tee "$GITHUB_WORKSPACE/date-g11-fullcpu-results/original-sha256.txt"
          for VERSION in parent child; do
            if [ "$VERSION" = parent ]; then cp /tmp/parent-pipemem.v rtl/core/pipemem.v; else cp /tmp/child-pipemem.v rtl/core/pipemem.v; fi
            export VERSION
            python3 - <<'PY'
          import os,pathlib,hashlib
          p=pathlib.Path('rtl/core/pipemem.v');s=p.read_text(); marker='// On any pipe request, the new address is the same or plus one'
          assert s.count(marker)==1,'original source anchor missing'
          insert='''// G11 RESEARCH COVER, observation only; outside the source change under test.
          // This is an existential query in the full zipcpu model, NOT a proof or deployed-CPU claim.
          always @(posedge i_clk)
            if (f_past_valid && f_cyc && !i_wb_stall && i_pipe_stb
                && i_addr == 32'h00000100
                && i_addr[(AW+1):2] == o_wb_addr
                && i_addr != o_wb_addr && i_addr != o_wb_addr+1)
              cover(1'b1);
          // END G11 research cover.
          '''
          s=s.replace(marker,insert+'\n\t'+marker)
          p.write_text(s)
          print(os.environ['VERSION'],'instrumented sha256',hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
            cd bench/formal
            echo "===== $VERSION original upstream CPU formal flow =====" | tee "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-build.log"
            set +e
            timeout 330 yosys -s zipcpu.ys >> "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-build.log" 2>&1
            BUILD=$?
            set -e
            echo "BUILD_EXIT=$BUILD" | tee -a "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-build.log"
            if [ -s zipcpu.smt2 ]; then
              cp zipcpu.smt2 "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-zipcpu.smt2"
              grep -E 'zipcpu_(n|a|u|t|i|c)' zipcpu.smt2 | head -30 > "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-model-symbols.txt" || true
              for DEPTH in 12 24; do
                set +e
                timeout 180 yosys-smtbmc -s z3 -c -t "$DEPTH" --dump-vcd "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-cover-depth$DEPTH.vcd" zipcpu.smt2 > "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-cover-depth$DEPTH.log" 2>&1
                STATUS=$?
                set -e
                echo "COVER_${VERSION}_DEPTH_${DEPTH}_EXIT=$STATUS" | tee -a "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-cover-depth$DEPTH.log"
                if grep -q 'Status: PASSED' "$GITHUB_WORKSPACE/date-g11-fullcpu-results/$VERSION-cover-depth$DEPTH.log"; then break; fi
              done
            fi
            cd ../..
            git checkout -- rtl/core/pipemem.v
          done
          echo 'Study complete: see individual tool exit codes; timeout and missing models are not UNSAT.'
      - name: Preserve all failure and success evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-g11-fullcpu-original-src-results
          path: date-g11-fullcpu-results/
          if-no-files-found: warn
          retention-days: 14