name: DATE G11 source-level reset-qualified prefetch audit
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths:
      - '.github/workflows/date-g11-reset-guard-source-audit.yml'
      - 'research/date-g11-exact-rom-formal/reset_guard_experiment.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys and pin independent Z3 4.13.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y yosys python3-pip gcc
          python3 -m pip install --user --quiet 'z3-solver==4.13.3.0'
          LIBPATH="$(python3 - <<'PY'
          import z3,pathlib
          assert z3.get_version()==(4,13,3,0)
          d=pathlib.Path(z3.__file__).resolve().parent/'lib'
          libs=sorted(x for x in d.glob('libz3.so*') if x.is_file())
          assert libs
          print(libs[0])
          PY
          )"
          gcc -O2 research/date-g11-exact-rom-formal/z3_smt_driver.c "$LIBPATH" -Wl,-rpath,"$(dirname "$LIBPATH")" -o "$GITHUB_WORKSPACE/g11_z3_driver"
          yosys -V
          python3 -c 'import z3;print("SOLVER",z3.get_version())'
      - name: Pin historical source, restrict source change to reset-qualified prefetch contract
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-reset-qualified-evidence"
          mkdir -p "$OUT"
          git clone --filter=blob:none https://github.com/ZipCPU/zipcpu.git /tmp/g11-source
          cd /tmp/g11-source
          git checkout --detach 128cab89f5edaae4699184f50c1334598ebe904e
          git rev-parse HEAD > "$OUT/parent_commit.txt"
          git show d511239e19be8fcc7f340a64554ea93699637e62:rtl/core/pipemem.v > /tmp/g11-child-pipemem.v
          cp rtl/core/pipemem.v /tmp/g11-parent-pipemem.v
          sha256sum rtl/core/{zipcpu,cpuops,dblfetch,mpyop,pipemem}.v /tmp/g11-child-pipemem.v bench/formal/zipcpu.ys > "$OUT/ORIGINAL_SHA256.txt"
          python3 "$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/reset_guard_experiment.py" /tmp/g11-source | tee "$OUT/FORMAL_GUARD_DIFF.txt"
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('/tmp/g11-source')
          for rel,a,b in [('rtl/core/zipcpu.v','abs_prefetch\t#(ADDRESS_WIDTH)','dblfetch\t#(ADDRESS_WIDTH)'),('rtl/core/cpuops.v','`define\tMPYOP\tabs_mpy','`define\tMPYOP\tmpyop')]:
              p=root/rel;s=p.read_text();assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=root/'bench/formal/zipcpu.ys';s=p.read_text()
          for a,b in [('read_verilog -D ZIPCPU -formal abs_prefetch.v','read_verilog -D ZIPCPU -formal ../../rtl/core/dblfetch.v'),('read_verilog -D ZIPCPU -formal abs_mpy.v','read_verilog -D ZIPCPU -formal ../../rtl/core/mpyop.v')]:
              assert s.count(a)==1;s=s.replace(a,b)
          p.write_text(s)
          PY
          sha256sum rtl/core/{zipcpu,cpuops,dblfetch,mpyop}.v bench/formal/zipcpu.ys > "$OUT/CONTROLLED_SHA256.txt"
          for REV in child parent; do
            cp "/tmp/g11-$REV-pipemem.v" rtl/core/pipemem.v
            (cd bench/formal && timeout 240 yosys -s zipcpu.ys > "$OUT/$REV-yosys.log" 2>&1)
            test -s bench/formal/zipcpu.smt2
            cp bench/formal/zipcpu.smt2 "$OUT/$REV.smt2"
            sha256sum "$OUT/$REV.smt2" >> "$OUT/MODEL_SHA256.txt"
            echo "SYNTHESIZED $REV"
          done
      - name: Test original source-level pulse guard kept with same fixed two instruction ROM
        shell: bash
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/g11-reset-qualified-evidence"
          GEN="$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/make_query.py"
          : > "$OUT/SUMMARY.txt"
          for CASE in child parent parent_relaxed; do
            MODEL=parent
            if [ "$CASE" = child ]; then MODEL=child; fi
            python3 "$GEN" "$OUT/$MODEL.smt2" "$OUT/$CASE-query.smt2" --case "$CASE" --pulse keep --depth 14 --min-target 12 --max-target 12 --single-fetch-anchor > "$OUT/$CASE-generator.log" 2>&1
            GEN_EXIT=$?
            if [ "$GEN_EXIT" -ne 0 ]; then echo "$CASE GENERATOR_FAILED=$GEN_EXIT" | tee -a "$OUT/SUMMARY.txt"; continue; fi
            if [ "$CASE" = parent ]; then
              python3 - "$OUT/$CASE-query.smt2" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text();assert s.count('(check-sat)')==1;p.write_text(s.split('(check-sat)',1)[0]+'(check-sat)\n')
          PY
            fi
            timeout 100 "$GITHUB_WORKSPACE/g11_z3_driver" "$OUT/$CASE-query.smt2" > "$OUT/$CASE-solver.log" 2> "$OUT/$CASE-stderr.log"
            RC=$?
            R=$(grep -m1 -E '^(sat|unsat|unknown)$' "$OUT/$CASE-solver.log" || true)
            echo "$CASE solver_exit=$RC RESULT=${R:-NO_RESULT}" | tee -a "$OUT/SUMMARY.txt"
          done
          python3 - "$OUT" <<'PY'
          import pathlib,sys,re
          out=pathlib.Path(sys.argv[1])
          expected={'child':'sat','parent':'unsat','parent_relaxed':'sat'}
          for k,v in expected.items():
              p=out/(k+'-solver.log')
              assert p.exists(),(k,'missing_solver_log')
              x=p.read_text()
              assert x.splitlines()[0]==v,(k,x[:250])
              q=(out/(k+'-query.smt2')).read_text()
              assert '(assert (|zipcpu_h| s12))' in q
              assert '  (|$paramod/dblfetch/ADDRESS_WIDTH=30_u 1| state)' in q, 'new-PC assumption must not be omitted'
              assert '#b00010100100000000000000100000000' in q and '#b00011100100000000000000100000000' in q
          x=(out/'parent_relaxed-solver.log').read_text()
          assert re.search(r'\(\(\|[^|]*pipemem[^|]*_a 4\| \(\|zipcpu_h domem\| s13\)\) false\)',x),'old assertion did not fail'
          print('PASS SOURCE_LEVEL_RESET_GUARD child SAT / parent UNSAT / parent-old-only-excluded SAT; observed false old assertion')
          PY
      - name: Preserve both raw source-level formal models, all outputs, failures and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-reset-qualified-fullcpu-evidence
          path: g11-reset-qualified-evidence/
          retention-days: 30
          if-no-files-found: warn
