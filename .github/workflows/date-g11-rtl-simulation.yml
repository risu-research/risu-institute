name: DATE G11 original RTL deterministic ROM replay
on:
  push:
    branches: [research/date-g11-causal-native-20260919]
    paths: ['.github/workflows/date-g11-rtl-simulation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concrete_program:
    strategy:
      fail-fast: false
      matrix:
        version: [parent, child]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilog simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          iverilog -V | head -2
      - name: Compile and replay original non-formal RTL with native dblfetch and fixed ROM
        shell: bash
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-rtl-$VERSION"
          mkdir -p "$OUT"
          git clone --filter=blob:none https://github.com/ZipCPU/zipcpu.git /tmp/zipcpu-rtl
          cd /tmp/zipcpu-rtl
          git checkout --detach 128cab89f5edaae4699184f50c1334598ebe904e
          if [ "$VERSION" = child ]; then git show d511239e19be8fcc7f340a64554ea93699637e62:rtl/core/pipemem.v > rtl/core/pipemem.v; fi
          sha256sum rtl/core/{zipcpu,pipemem,cpuops,dblfetch,mpyop}.v rtl/cpudefs.v > "$OUT/ORIGINAL_SHA256.txt"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rtl/core/zipcpu.v');s=p.read_text()
          anchor='`ifdef\tFORMAL\n\tabs_prefetch\t#(ADDRESS_WIDTH)'
          assert s.count(anchor)==1
          s=s.replace(anchor,'`ifdef\tG11_NATIVE_FETCH\n\tdblfetch\t#(ADDRESS_WIDTH)')
          p.write_text(s)
          print('NON-FORMAL build: original zipcpu RTL, original dblfetch and multiplier; only module-selection preprocessor flag changed')
          PY
          sha256sum rtl/core/{zipcpu,pipemem,cpuops,dblfetch,mpyop}.v rtl/cpudefs.v > "$OUT/MODEL_SHA256.txt"
          cp "$GITHUB_WORKSPACE/research/g11/native_fetch_two_word_tb.v" "$OUT/testbench.v"
          set +e
          iverilog -g2012 -D G11_NATIVE_FETCH -s native_fetch_two_word_tb -I rtl -o "$OUT/simulation.vvp" "$OUT/testbench.v" rtl/core/zipcpu.v rtl/core/cpuops.v rtl/core/memops.v rtl/core/pipemem.v rtl/core/idecode.v rtl/core/div.v rtl/core/dblfetch.v rtl/core/mpyop.v rtl/ex/wbdblpriarb.v > "$OUT/compile.log" 2>&1
          CODE=$?
          echo "IVERILOG_EXIT=$CODE" | tee -a "$OUT/compile.log"
          if [ "$CODE" -eq 0 ]; then
            cd "$OUT"
            timeout 90 vvp simulation.vvp > simulation.log 2>&1
            echo "VVP_EXIT=$?" >> simulation.log
            grep -E 'FETCH_VALID|PIPE_REQ|NATIVE_FETCH_WITNESS|SUMMARY|NO_SIM_WITNESS' simulation.log | head -65 || true
          fi
          exit 0
      - name: Preserve complete positive or negative result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-native-rtl-${{ matrix.version }}
          path: g11-rtl-${{ matrix.version }}/
          retention-days: 14
          if-no-files-found: warn