name: DATE G11 source-level reset guard final independent audit
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths: ['.github/workflows/date-g11-source-guard-final.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fresh historical source and pinned independent solver
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-source-final"; mkdir -p "$OUT"
          sudo apt-get update -qq; sudo apt-get install -y yosys gcc python3-pip
          python3 -m pip install --user --quiet 'z3-solver==4.13.3.0'
          LIB="$(python3 - <<'PY'
          import z3,pathlib
          assert z3.get_version()==(4,13,3,0)
          d=pathlib.Path(z3.__file__).resolve().parent/'lib'
          print(next(x for x in d.glob('libz3.so*') if x.is_file()))
          PY
          )"
          gcc -O2 "$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/z3_smt_driver.c" "$LIB" -Wl,-rpath,"$(dirname "$LIB")" -o "$GITHUB_WORKSPACE/g11_z3"
          yosys -V > "$OUT/TOOLS.txt"; python3 -c 'import z3;print(z3.get_version())' >> "$OUT/TOOLS.txt"
          git clone --filter=blob:none https://github.com/ZipCPU/zipcpu.git /tmp/g11-historical
          cd /tmp/g11-historical
          git checkout --detach 128cab89f5edaae4699184f50c1334598ebe904e
          git rev-parse HEAD > "$OUT/PARENT_COMMIT.txt"
          cp rtl/core/pipemem.v /tmp/g11-original-parent.v
          git show d511239e19be8fcc7f340a64554ea93699637e62:rtl/core/pipemem.v > /tmp/g11-original-child.v
          sha256sum /tmp/g11-original-{parent,child}.v rtl/core/{dblfetch,zipcpu,cpuops,mpyop}.v bench/formal/zipcpu.ys > "$OUT/ORIGINAL_SHA256.txt"
          python3 "$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/reset_guard_experiment.py" /tmp/g11-historical > "$OUT/SOURCE_PATCH.txt"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/g11-historical')
          for rel,a,b in [('rtl/core/zipcpu.v','abs_prefetch\t#(ADDRESS_WIDTH)','dblfetch\t#(ADDRESS_WIDTH)'),('rtl/core/cpuops.v','`define\tMPYOP\tabs_mpy','`define\tMPYOP\tmpyop')]:
              p=root/rel;s=p.read_text();assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=root/'bench/formal/zipcpu.ys';s=p.read_text()
          for a,b in [('read_verilog -D ZIPCPU -formal abs_prefetch.v','read_verilog -D ZIPCPU -formal ../../rtl/core/dblfetch.v'),('read_verilog -D ZIPCPU -formal abs_mpy.v','read_verilog -D ZIPCPU -formal ../../rtl/core/mpyop.v')]:
              assert s.count(a)==1;s=s.replace(a,b)
          p.write_text(s)
          PY
          sha256sum rtl/core/{dblfetch,zipcpu,cpuops,mpyop}.v bench/formal/zipcpu.ys > "$OUT/CONTROLLED_SHA256.txt"
          for CASE in parent child; do
            cp "/tmp/g11-original-$CASE.v" rtl/core/pipemem.v
            (cd bench/formal && timeout 180 yosys -s zipcpu.ys > "$OUT/$CASE-yosys.log" 2>&1)
            test -s bench/formal/zipcpu.smt2
            cp bench/formal/zipcpu.smt2 "$OUT/$CASE.smt2"
            sha256sum "$OUT/$CASE.smt2" >> "$OUT/MODEL_SHA256.txt"
          done
      - name: Run anchor-free exact ROM same-condition three-case audit
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-source-final"
          for CASE in child parent parent_relaxed; do
            MODEL=parent; if [ "$CASE" = child ];then MODEL=child;fi
            python3 research/date-g11-exact-rom-formal/reset_guard_query.py "$OUT/$MODEL.smt2" "$OUT/$CASE.smt2" --case "$CASE" --pulse keep --min-target 12 --max-target 12 --single-fetch-anchor > "$OUT/$CASE-generator.log"
            python3 - "$OUT/$CASE.smt2" "$CASE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);case=sys.argv[2];s=p.read_text()
          anchor='(assert (= (|zipcpu_n pf_valid| s5) true))\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,'')
          if case=='parent':s=s.split('(check-sat)',1)[0]+'(check-sat)\n'
          assert s.count('(check-sat)')==1
          assert '  (|$paramod/dblfetch/ADDRESS_WIDTH=30_u 1| state)\n' in s
          assert '  true ; DIAGNOSTIC ONLY: omit dblfetch.v:350' not in s
          p.write_text(s)
          PY
            timeout 100 "$GITHUB_WORKSPACE/g11_z3" "$OUT/$CASE.smt2" > "$OUT/$CASE-solver.log" 2> "$OUT/$CASE-stderr.log"
            echo "$CASE $(head -1 "$OUT/$CASE-solver.log")" | tee -a "$OUT/SUMMARY.txt"
          done
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys,re,hashlib
          d=Path(sys.argv[1]);expected={'child':'sat','parent':'unsat','parent_relaxed':'sat'}
          for case,verdict in expected.items():
              txt=(d/f'{case}-solver.log').read_text();assert txt.splitlines()[0]==verdict,(case,txt[:200])
              q=(d/f'{case}.smt2').read_text()
              assert '(assert (|zipcpu_h| s12))' in q
              assert '(assert (= (|zipcpu_n pf_valid| s5) true))' not in q
              assert '  (|$paramod/dblfetch/ADDRESS_WIDTH=30_u 1| state)\n' in q
              for word in ('00010100100000000000000100000000','00011100100000000000000100000000'):assert '#b'+word in q
              assert '(assert (or (and' in q
              assert q.count('(check-sat)')==1
          txt=(d/'parent_relaxed-solver.log').read_text()
          assert re.search(r'\(\(\|[^|]*pipemem[^|]*_a 4\| \(\|zipcpu_h domem\| s13\)\) false\)',txt)
          for case in ('child','parent'):
              s=(d/f'{case}.smt2').read_text()
              model=(d/f'{case}.smt2').read_text()
              assert 'reset-qualified' in (d/'SOURCE_PATCH.txt').read_text().lower() or 'RESET_QUALIFIED' in (d/'SOURCE_PATCH.txt').read_text()
          print('PASS independent source-level reset-guard/no-anchor/fixed-program child SAT / strict parent UNSAT / old-assertion-only parent SAT')
          PY
      - name: Preserve complete sources, models, queries, witnesses and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-source-guard-anchor-free-final
          path: g11-source-final/
          if-no-files-found: warn
          retention-days: 30
