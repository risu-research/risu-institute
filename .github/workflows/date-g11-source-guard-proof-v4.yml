name: DATE G11 source-level guard anchor-free reproducibility V4
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths: ['.github/workflows/date-g11-source-guard-proof-v4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild pinned historical CPUs, retaining immutable originals
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-proof-v4"; mkdir -p "$OUT/models" "$OUT/queries"
          sudo apt-get update -qq; sudo apt-get install -y yosys gcc python3-pip
          python3 -m pip install --user --quiet 'z3-solver==4.13.3.0'
          LIB="$(python3 - <<'PY'
          import pathlib,z3
          assert z3.get_version()==(4,13,3,0)
          print(next(x for x in (pathlib.Path(z3.__file__).resolve().parent/'lib').glob('libz3.so*') if x.is_file()))
          PY
          )"
          gcc -O2 "$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/z3_smt_driver.c" "$LIB" -Wl,-rpath,"$(dirname "$LIB")" -o "$GITHUB_WORKSPACE/z3driver"
          yosys -V > "$OUT/TOOLS.txt"; python3 -c 'import z3;print(z3.get_version())' >> "$OUT/TOOLS.txt"
          git clone --filter=blob:none https://github.com/ZipCPU/zipcpu.git /tmp/g11-v4
          cd /tmp/g11-v4
          git checkout --detach 128cab89f5edaae4699184f50c1334598ebe904e
          git rev-parse HEAD > "$OUT/PARENT_COMMIT.txt"
          cp rtl/core/pipemem.v /tmp/g11-parent-original.v
          git show d511239e19be8fcc7f340a64554ea93699637e62:rtl/core/pipemem.v > /tmp/g11-child-original.v
          sha256sum /tmp/g11-{parent,child}-original.v rtl/core/{dblfetch,zipcpu,cpuops,mpyop}.v bench/formal/zipcpu.ys > "$OUT/ORIGINAL_SOURCE_SHA256.txt"
          python3 "$GITHUB_WORKSPACE/research/date-g11-exact-rom-formal/reset_guard_experiment.py" /tmp/g11-v4 > "$OUT/SOURCE_PATCH.txt"
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('/tmp/g11-v4')
          for rel,a,b in [('rtl/core/zipcpu.v','abs_prefetch\t#(ADDRESS_WIDTH)','dblfetch\t#(ADDRESS_WIDTH)'),('rtl/core/cpuops.v','`define\tMPYOP\tabs_mpy','`define\tMPYOP\tmpyop')]:
              p=root/rel;s=p.read_text();assert s.count(a)==1;p.write_text(s.replace(a,b))
          p=root/'bench/formal/zipcpu.ys';s=p.read_text()
          for a,b in [('read_verilog -D ZIPCPU -formal abs_prefetch.v','read_verilog -D ZIPCPU -formal ../../rtl/core/dblfetch.v'),('read_verilog -D ZIPCPU -formal abs_mpy.v','read_verilog -D ZIPCPU -formal ../../rtl/core/mpyop.v')]:
              assert s.count(a)==1;s=s.replace(a,b)
          p.write_text(s)
          PY
          sha256sum rtl/core/{dblfetch,zipcpu,cpuops,mpyop}.v bench/formal/zipcpu.ys > "$OUT/CONTROLLED_SHA256.txt"
          for VERSION in parent child; do
            cp "/tmp/g11-$VERSION-original.v" rtl/core/pipemem.v
            (cd bench/formal && timeout 180 yosys -s zipcpu.ys > "$OUT/$VERSION-yosys.log" 2>&1)
            cp bench/formal/zipcpu.smt2 "$OUT/models/$VERSION.smt2"
            sha256sum "$OUT/models/$VERSION.smt2" >> "$OUT/MODEL_SHA256.txt"
          done
      - name: Prove exactly matched no-anchor three-way result and old assertion false
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/g11-proof-v4"
          sha256sum "$OUT/models/"*.smt2 > "$OUT/MODEL_BEFORE.txt"
          for CASE in child parent parent_relaxed; do
            MODEL=parent; if [ "$CASE" = child ];then MODEL=child;fi
            python3 research/date-g11-exact-rom-formal/reset_guard_query.py "$OUT/models/$MODEL.smt2" "$OUT/queries/$CASE.smt2" --case "$CASE" --pulse keep --min-target 12 --max-target 12 --single-fetch-anchor > "$OUT/$CASE-generator.log"
            python3 - "$OUT/queries/$CASE.smt2" "$CASE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text();anchor='(assert (= (|zipcpu_n pf_valid| s5) true))\n'
          assert s.count(anchor)==1;s=s.replace(anchor,'')
          if sys.argv[2]=='parent':s=s.split('(check-sat)',1)[0]+'(check-sat)\n'
          assert s.count('(check-sat)')==1
          assert s.count('  (|$paramod/dblfetch/ADDRESS_WIDTH=30_u 1| state)\n')==1
          assert '  true ; DIAGNOSTIC ONLY: omit dblfetch.v:350' not in s
          p.write_text(s)
          PY
            timeout 100 "$GITHUB_WORKSPACE/z3driver" "$OUT/queries/$CASE.smt2" > "$OUT/$CASE-solver.log" 2> "$OUT/$CASE-stderr.log"
            echo "$CASE $(head -1 "$OUT/$CASE-solver.log")" | tee -a "$OUT/SUMMARY.txt"
          done
          sha256sum "$OUT/models/"*.smt2 > "$OUT/MODEL_AFTER.txt"
          cmp "$OUT/MODEL_BEFORE.txt" "$OUT/MODEL_AFTER.txt"
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import sys,re,hashlib
          d=Path(sys.argv[1]);exp={'child':'sat','parent':'unsat','parent_relaxed':'sat'}
          for case,v in exp.items():
              t=(d/f'{case}-solver.log').read_text();assert t.splitlines()[0]==v,(case,t[:200])
              q=(d/'queries'/f'{case}.smt2').read_text()
              assert '(assert (|zipcpu_h| s12))' in q
              assert '(assert (= (|zipcpu_n pf_valid| s5) true))' not in q
              assert '  (|$paramod/dblfetch/ADDRESS_WIDTH=30_u 1| state)\n' in q
              assert '  true ; DIAGNOSTIC ONLY: omit dblfetch.v:350' not in q
              for word in ('00010100100000000000000100000000','00011100100000000000000100000000'):assert '#b'+word in q
              orig=(d/'models'/f'{"child" if case=="child" else "parent"}.smt2').read_text()
              if case!='parent_relaxed':assert orig in q
              assert q.count('(check-sat)')==1
          old=(d/'parent_relaxed-solver.log').read_text()
          assert re.search(r'\(\(\|[^|]*pipemem[^|]*_a 4\| \(\|zipcpu_h domem\| s13\)\) false\)',old)
          print('PASS no-anchor child SAT / strict parent UNSAT / old-assertion-only parent SAT; original models never overwritten')
          PY
      - name: Preserve source models, exact queries, solver traces and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-source-guard-v4-certified
          path: g11-proof-v4/
          retention-days: 30
          if-no-files-found: warn
