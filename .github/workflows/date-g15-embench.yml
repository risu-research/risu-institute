name: DATE G15 Embench baseline-only research
on:
  push:
    branches: [research/date-g15-embench-baseline-20260919]
permissions:
  contents: read
jobs:
  embench-baselines:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Install public cross compiler and parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          python3 -m pip install --user pyelftools
      - name: Run pinned official Embench sources under fixed strong baselines
        run: bash research/date-g15/run_benchmark.sh
      - name: Retain successes and failures for independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-g15-baseline-evidence
          path: date-g15-output/
          if-no-files-found: warn
          retention-days: 30
