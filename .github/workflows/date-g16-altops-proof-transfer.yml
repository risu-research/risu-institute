name: DATE G16 documented alternative-operation proof-transfer contrast
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths: ['.github/workflows/date-g16-altops-proof-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  altops-surrogate:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pin unchanged CPU and checkers, with formally documented alternate-operation mode
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          mkdir -p g16/src g16/logs
          cp research/date-g16-altops/PROTOCOL.md g16/PROTOCOL.md
          cp research/date-g15-oracle-cpu/picorv32_signed_div_oracle_tb.sv g16/src/original_G15_tb.sv
          git clone --filter=blob:none https://github.com/YosysHQ/picorv32.git /tmp/g16-cpu
          git clone --filter=blob:none https://github.com/YosysHQ/riscv-formal.git /tmp/g16-oracle
          git -C /tmp/g16-cpu show 'de92ce54e8a3f24f2adc6b5d04de35e4edb873e5:picorv32.v' > g16/src/picorv32.v
          for OP in div rem;do git -C /tmp/g16-oracle show "c992aa61fdfe0846c5ed90324c596202a1c69b76:insns/insn_${OP}.v" > "g16/src/original_${OP}.v";done
          git -C /tmp/g16-oracle show 'c992aa61fdfe0846c5ed90324c596202a1c69b76:cores/picorv32/checks.cfg' > g16/ORIGINAL_CHECKS.cfg
          grep -q '^`define RISCV_FORMAL_ALTOPS' g16/ORIGINAL_CHECKS.cfg
          test "$(git hash-object g16/src/original_div.v)" = 08ace69977b0fd8a97d776696a354bb504f5fcad
          test "$(git hash-object g16/src/original_rem.v)" = 699f5a65b8757de9e711ed305dd570f27c78c2a3
          python3 - <<'PY'
          from pathlib import Path
          for op,sym in (('div','/'),('rem','%')):
            s=Path(f'g16/src/original_{op}.v').read_text()
            old=f'$signed(rvfi_rs1_rdata) {sym} $signed(rvfi_rs2_rdata);'
            assert s.count(old)==1
            s=s.replace(old,f'{{$signed(rvfi_rs1_rdata) {sym} $signed(rvfi_rs2_rdata)}};',1)
            oldmod=f'module rvfi_insn_{op} ('
            assert s.count(oldmod)==1
            Path(f'g16/src/corrected_{op}.v').write_text(s.replace(oldmod,f'module rvfi_insn_{op}_corrected (',1))
          s=Path('g16/src/original_G15_tb.sv').read_text()
          old='if (cpu_q!==expect_q || cpu_r!==expect_r) $fatal(1,"real CPU disagrees with independent ISA testid=%0d q=%h r=%h expected q=%h r=%h",testid,cpu_q,cpu_r,expect_q,expect_r);'
          assert s.count(old)==1
          s=s.replace(old,'if (cpu_q===expect_q && cpu_r===expect_r) $fatal(1,"ALTOPS unexpectedly matched actual ISA on testid=%0d",testid);')
          old='if(corrected_rejected!==0)$fatal(1,"corrected checker rejected real CPU");'
          assert s.count(old)==1
          s=s.replace(old,'if(correct_rejected!==0 || corrected_rejected!==0)$fatal(1,"ALT operation checker mismatch");')
          old='END actual_isa_pass=3 original_false_rejections=%0d corrected_false_rejections=%0d'
          assert s.count(old)==1
          s=s.replace(old,'END ALTOPS_surrogate_cases=3 original_rejects=%0d corrected_rejects=%0d')
          s=s.replace('actual_cpu_q=','surrogate_cpu_q=').replace('actual_cpu_r=','surrogate_cpu_r=').replace('original_rejects_cpu=','original_rejects_surrogate=')
          Path('g16/src/altops_tb.sv').write_text(s)
          PY
          sha256sum g16/src/* > g16/SOURCE_SHA256.txt
          git hash-object g16/src/picorv32.v > g16/CPU_BLOB_SHA1.txt
          iverilog -V 2>&1 | head -3 > g16/TOOLS.txt
      - name: Execute same program with documented ALT CPU and ALT ISA checker
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -DRISCV_FORMAL_ALTOPS -DRISCV_FORMAL_XLEN=32 -DRISCV_FORMAL_ILEN=32 -s picorv32_signed_div_oracle_tb -o g16/altops_tb g16/src/{picorv32.v,original_div.v,original_rem.v,corrected_div.v,corrected_rem.v,altops_tb.sv} > g16/logs/compile.log 2>&1
          vvp g16/altops_tb > g16/logs/ALT_CPU_ORACLE.log 2>&1
          grep -E '^(CASE |CPU_COMPLETED|END )' g16/logs/ALT_CPU_ORACLE.log | tee g16/RESULT.txt
          grep -q 'END ALTOPS_surrogate_cases=3 original_rejects=0 corrected_rejects=0' g16/RESULT.txt
      - name: Preserve source, outputs, and failures for independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g16-original-cpu-and-oracle-alternative-operations
          path: g16/
          retention-days: 30
