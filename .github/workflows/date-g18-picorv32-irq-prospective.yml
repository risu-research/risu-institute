name: DATE G18 prospectively frozen PicoRV32 timer IRQ case
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths: ['.github/workflows/date-g18-picorv32-irq-prospective.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  irq-original:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch immutable original parent and child; register original config and fileset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g18-irq/src g18-irq/logs g18-irq/timing g18-irq/formal
          git clone --filter=blob:none https://github.com/YosysHQ/picorv32.git /tmp/g18-irq-repo
          git -C /tmp/g18-irq-repo show e308982e18fc952a8d446ddb7ea8b70433a998c2:picorv32.v >g18-irq/src/parent.v
          git -C /tmp/g18-irq-repo show 258d63d4762a86385f69c7699b485c0c5559c763:picorv32.v >g18-irq/src/child.v
          test "$(git hash-object g18-irq/src/child.v)" = 4b1eca91fa5dd69d80e4b981b1977edaec1d2b06
          git -C /tmp/g18-irq-repo show 258d63d4762a86385f69c7699b485c0c5559c763:picorv32.core >g18-irq/src/historical.core
          git -C /tmp/g18-irq-repo show 258d63d4762a86385f69c7699b485c0c5559c763:Makefile >g18-irq/src/historical.Makefile
          git -C /tmp/g18-irq-repo diff --name-only e308982e18fc952a8d446ddb7ea8b70433a998c2 258d63d4762a86385f69c7699b485c0c5559c763 >g18-irq/CHANGED_FILES.txt
          if git -C /tmp/g18-irq-repo cat-file -e 258d63d4762a86385f69c7699b485c0c5559c763:.github/workflows/ci.yml 2>/dev/null;then echo HISTORIC_WORKFLOW_EXISTS;else echo NO_HISTORIC_WORKFLOW_AT_COMMIT;fi >g18-irq/HISTORICAL_WORKFLOW_STATUS.txt
          grep -n 'parameter.*ENABLE_IRQ\|parameter.*ENABLE_IRQ_TIMER' g18-irq/src/child.v >g18-irq/DEFAULTS.txt
          sha256sum g18-irq/src/* >g18-irq/SOURCE_SHA256.txt
      - name: Genuine memory-bus CPU, timed external interrupt, never force a DUT register
        shell: bash
        run: |
          set -euo pipefail
          cat > g18-irq/src/tb.v <<'SV'
          `timescale 1ns/1ps
          module tb;
            reg clk=0,resetn=0,mem_ready=0;
            always #5 clk=~clk;
            wire trap,mem_valid,mem_instr;
            wire [31:0] mem_addr,mem_wdata,eoi;
            wire [3:0] mem_wstrb;
            reg [31:0] mem_rdata=0,irq=0;
            reg [31:0] ram[0:255];
            integer j,tick=0,fetches=0,irq_seen=0,timer_eoi_seen=0,external_eoi_seen=0;
            integer init_t=5,inject_at=3,phase=0,hold=1,emit_irq=0,real_timer_started=0;
            function [31:0] addi(input [4:0] rd,rs,input [11:0] imm);
              addi={imm,rs,3'b000,rd,7'h13};
            endfunction
            function [31:0] timer_insn(input [4:0] rs);
              timer_insn={7'd5,5'd0,rs,3'd0,5'd0,7'h0b};
            endfunction
            picorv32 #(.ENABLE_IRQ(1),.ENABLE_IRQ_TIMER(1),.PROGADDR_IRQ(32'h40),.REGS_INIT_ZERO(1),.MASKED_IRQ(32'h00000002),.COMPRESSED_ISA(0)) dut (
             .clk(clk),.resetn(resetn),.trap(trap),.mem_valid(mem_valid),.mem_instr(mem_instr),.mem_ready(mem_ready),.mem_addr(mem_addr),.mem_wdata(mem_wdata),.mem_wstrb(mem_wstrb),.mem_rdata(mem_rdata),.irq(irq),.eoi(eoi),.pcpi_wr(1'b0),.pcpi_rd(32'd0),.pcpi_wait(1'b0),.pcpi_ready(1'b0));
            initial begin
              if(!$value$plusargs("T=%d",init_t)) init_t=5;
              if(!$value$plusargs("I=%d",inject_at)) inject_at=3;
              if(!$value$plusargs("PHASE=%d",phase)) phase=0;
              for(j=0;j<256;j=j+1)ram[j]=32'h00000013;
              ram[0]=addi(1,0,init_t);
              ram[1]=timer_insn(1);
              ram[2]=32'h0000006f;
              ram[16]=32'h0000006f;
              repeat(8) @(negedge clk); resetn=1;
              repeat(330) @(negedge clk);
              $display("FINAL t=%0d inject=%0d phase=%0d fetch=%0d external_eoi=%0d timer_eoi=%0d irq_entry=%0d timer=%08h pending=%08h active=%b",init_t,inject_at,phase,fetches,external_eoi_seen,timer_eoi_seen,irq_seen,dut.timer,dut.irq_pending,dut.irq_active);
              if(fetches<2 || !real_timer_started) $fatal(1,"INVALID: genuine timer instruction did not execute");
              $finish;
            end
            always @(negedge clk) begin
              if(resetn) begin
                tick=tick+1;
                if(dut.timer == init_t && tick>8) real_timer_started=1;
                if(!emit_irq && real_timer_started && dut.timer == inject_at && phase==0) begin irq[3]=1;emit_irq=1;end
                else if(emit_irq==1)begin irq[3]=0;emit_irq=2;end
                if(!emit_irq && real_timer_started && dut.timer == inject_at && phase==1)begin emit_irq=3;end
                else if(emit_irq==3)begin irq[3]=1;emit_irq=4;end
                else if(emit_irq==4)begin irq[3]=0;emit_irq=5;end
              end
            end
            always @(posedge clk) begin
              mem_ready <= 0;
              if(mem_valid && !mem_ready && mem_addr<1024)begin
                mem_ready <= 1;
                mem_rdata <= ram[mem_addr>>2];
                if(mem_wstrb[0])ram[mem_addr>>2][7:0]<=mem_wdata[7:0];
              end
              if(resetn && mem_valid && mem_ready && mem_instr) begin
                fetches=fetches+1;
                if(fetches<=5)$display("FETCH pc=%08h instr=%08h",mem_addr,mem_rdata);
              end
              if(resetn && eoi!=0)begin
                irq_seen=irq_seen+1;
                if(eoi[0])timer_eoi_seen=timer_eoi_seen+1;
                if(eoi[3])external_eoi_seen=external_eoi_seen+1;
                $display("EOI=%08h timer=%08h pending=%08h",eoi,dut.timer,dut.irq_pending);
              end
            end
          endmodule
          SV
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,re,csv
          p=Path('g18-irq'); timings=[]; rows=[]
          for rev in ('parent','child'):
            cmd=['iverilog','-g2012','-s','tb','-o',str(p/f'{rev}.vvp'),str(p/'src'/f'{rev}.v'),str(p/'src/tb.v')]
            t=time.monotonic(); r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=60)
            dt=time.monotonic()-t;(p/'logs'/f'{rev}_compile.log').write_text(r.stdout)
            timings.append(dict(rev=rev,phase='compile',wall_seconds=round(dt,6),exit=r.returncode))
            if r.returncode:continue
            for tval in (3,4,5,6,7,8,10,12):
              for at in range(1,tval+1):
                for ph in (0,1):
                  cmd=['vvp',str(p/f'{rev}.vvp'),f'+T={tval}',f'+I={at}',f'+PHASE={ph}']
                  st=time.monotonic(); rr=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=12)
                  dt=time.monotonic()-st
                  name=f'{rev}_T{tval}_I{at}_P{ph}.log';(p/'logs'/name).write_text(rr.stdout)
                  m=re.search(r'FINAL t=(\d+) inject=(\d+) phase=(\d+) fetch=(\d+) external_eoi=(\d+) timer_eoi=(\d+) irq_entry=(\d+) timer=([0-9a-fx]+) pending=([0-9a-fx]+) active=([0-9bx]+)',rr.stdout)
                  rows.append(dict(rev=rev,T=tval,I=at,phase=ph,exit=rr.returncode,wall_seconds=round(dt,6),fetch=int(m.group(4)) if m else -1,external_eoi=int(m.group(5)) if m else -1,timer_eoi=int(m.group(6)) if m else -1,trace=name))
          with (p/'NATIVE_MATRIX.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          (p/'timing'/'compile.json').write_text(json.dumps(timings,indent=2))
          by={(r['T'],r['I'],r['phase'],r['rev']):r for r in rows}
          different=[]
          for tval,at,ph in {(r['T'],r['I'],r['phase']) for r in rows}:
            a,b=by[tval,at,ph,'parent'],by[tval,at,ph,'child']
            if a['exit']==0 and b['exit']==0 and (a['external_eoi'],a['timer_eoi'])!=(b['external_eoi'],b['timer_eoi']):different.append((tval,at,ph,a['external_eoi'],a['timer_eoi'],b['external_eoi'],b['timer_eoi']))
          (p/'DIFFERENTIAL.txt').write_text('\n'.join(map(str,sorted(different)))+'\n')
          print('MATRIX',len(rows),'VALID',sum(r['exit']==0 for r in rows),'DIFFERENCES',len(different),'EXAMPLES',sorted(different)[:8]);print('COMPILE',timings)
          PY
      - name: Pinned original upstream ADDI formal checker at default IRQ-off configuration; no status inference from make
        shell: bash
        run: |
          set -uo pipefail
          git clone --filter=blob:none https://github.com/YosysHQ/riscv-formal.git /tmp/g18-irq-rvf
          git -C /tmp/g18-irq-rvf checkout c992aa61fdfe0846c5ed90324c596202a1c69b76
          git -C /tmp/g18-irq-rvf rev-parse HEAD >g18-irq/formal/FRAMEWORK_PIN.txt
          cp /tmp/g18-irq-rvf/cores/picorv32/wrapper.sv g18-irq/formal/ORIGINAL_WRAPPER.sv
          cp /tmp/g18-irq-rvf/cores/picorv32/checks.cfg g18-irq/formal/ORIGINAL_CHECKS.cfg
          for rev in parent child;do
            cp g18-irq/src/${rev}.v /tmp/g18-irq-rvf/cores/picorv32/picorv32.v
            cd /tmp/g18-irq-rvf/cores/picorv32
            python3 ../../checks/genchecks.py >"$GITHUB_WORKSPACE/g18-irq/formal/${rev}_generator.log" 2>&1
            gen=$?;echo "generator_exit=$gen">"$GITHUB_WORKSPACE/g18-irq/formal/${rev}_STATUS.txt"
            if [ "$gen" -eq 0 ];then
              /usr/bin/time -f '%e' -o "$GITHUB_WORKSPACE/g18-irq/timing/${rev}_formal_seconds.txt" timeout 115 make -C checks insn_addi_ch0 >"$GITHUB_WORKSPACE/g18-irq/formal/${rev}_make.log" 2>&1
              rc=$?;echo "make_exit=$rc">>"$GITHUB_WORKSPACE/g18-irq/formal/${rev}_STATUS.txt"
              find checks/insn_addi_ch0 -name status -exec cat {} \; >"$GITHUB_WORKSPACE/g18-irq/formal/${rev}_SBY_STATUS.txt" 2>/dev/null
              tar -czf "$GITHUB_WORKSPACE/g18-irq/formal/${rev}_proof.tar.gz" -C checks insn_addi_ch0
            fi
            cd "$GITHUB_WORKSPACE"
          done
          exit 0
      - name: Preserve full native and formal logs including negative and no-hit cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g18-prospective-irq-original-bus-and-formal
          path: g18-irq/
          retention-days: 30
