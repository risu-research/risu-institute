name: DATE G18 SERV CSR corrected stimulus, original RTL retained
on:
  push:
    branches: [research/date-g11-exact-rom-formal-20260920]
    paths: ['.github/workflows/date-g18-serv-csr-tiers-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serv-csr-v2:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct only invalid harness first-attempt stimulus; execute original script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g18-serv
          echo 'V2: initial harness failed because CSR enable was deasserted before parent delayed update_rd; hold i_csr_en one more rising edge. No source/DUT edits. Also repair testbench preprocessor display line. First run 35515824313 preserved.' > g18-serv/HARNESS_AMENDMENT.txt
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          content=Path('.github/workflows/date-g18-serv-csr-tiers.yml').read_text()
          def script(title,next_title):
            a=content.index('      - name: '+title)
            b=content.index('      - name: '+next_title,a)
            s=content[a:b].split('        run: |',1)[1]
            return textwrap.dedent(s).strip()+'\n'
          s=script('Source-verified tiers and genuine original-module native regression','Existing upstream riscv-formal ADDI checker for both original revisions; preserve exact SBY statuses')
          old='@(negedge clk); cnt_en=0; wen0=0; csr_en=0; cnt_done=0;\n                repeat(2) @(negedge clk);'
          new='@(negedge clk); cnt_en=0; wen0=0; csr_en=csr_requested; cnt_done=0;\n                @(negedge clk); csr_en=0;\n                repeat(2) @(negedge clk);'
          assert s.count(old)==1, 'harness exact source changed'
          s=s.replace(old,new)
          old2='$display("G18_SERV_CSR_NATIVE_SUCCESS rev=%s",`ifdef PARENT "parent" `else "child" `endif );'
          assert s.count(old2)==1
          s=s.replace(old2,'$display("G18_SERV_CSR_NATIVE_SUCCESS");')
          Path('g18-serv/V2_NATIVE_SCRIPT.sh').write_text(s)
          r=subprocess.run(['bash','-e','-o','pipefail','g18-serv/V2_NATIVE_SCRIPT.sh'])
          if r.returncode:raise SystemExit(r.returncode)
          PY
      - name: Execute existing original formal checker after corrected module-level regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          c=Path('.github/workflows/date-g18-serv-csr-tiers.yml').read_text()
          a=c.index('      - name: Existing upstream riscv-formal ADDI checker for both original revisions; preserve exact SBY statuses')
          b=c.index('      - name: Archive positive, negative, and tool-failure evidence',a)
          s=textwrap.dedent(c[a:b].split('        run: |',1)[1]).strip()+'\n'
          Path('g18-serv/V2_FORMAL_SCRIPT.sh').write_text(s)
          subprocess.run(['bash','g18-serv/V2_FORMAL_SCRIPT.sh'],check=True)
          PY
      - name: Preserve amended attempts and all check status files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g18-serv-csr-v2-harness-and-formal
          path: g18-serv/
          retention-days: 30
