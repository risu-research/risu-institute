name: G20 independent DC circuit check (research only)
on:
  push:
    branches: [research/date-g20-lease-interlock-20260919]
permissions:
  contents: read
jobs:
  dc:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install independent ngspice solver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          ngspice --version | head -3
      - name: Solve declared electrical networks and preserve raw logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g20-results
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('g20-results')
          # EXACT values from original Adafruit R8=10k plus proposed external parts.
          # This is an idealized RESISTOR+SWITCH model, NOT a vendor transistor/charger/WDT model.
          cases=[('stock_host_z',4.5,None,False,False),('new_host_z_low_rail',1.6,None,False,False),('new_host_z_high_rail',4.5,None,False,False),('new_MCU_permit',4.5,3.3,False,True),('new_watchdog_fault_MCU_stuck_high',4.5,3.3,True,True)]
          out=[]
          for name,rail,mcu,wdofault,has_network in cases:
              lines=[f'G20 {name}',f'Vout out 0 DC {rail}', 'R8 ce 0 10000','Rinternal ce 0 285000']
              if has_network:
                  lines+=['Rpermit out ce 560', 'Rgate gate 0 4700','Rwdopull out gate 100000', 'Spermit ce 0 gate 0 SWPERMIT', '.model SWPERMIT SW(RON=10 ROFF=1G VT=1 VH=0)']
                  if mcu is not None: lines+=['Vmcu mcu 0 DC 3.3','Rseries mcu gate 1000']
                  if wdofault: lines+=['Vwdo wdo 0 DC 0.4','Rwdo gate wdo 0.01']
              else:
                  # Original board has R8 pulling CE to GND, and no external GPIO.
                  lines+=['Rnoconn ce out 1e12']
              lines+=['.control','op','print v(ce)'+(' v(gate)' if has_network else ''),'quit','.endc','.end']
              path=root/(name+'.cir');path.write_text('\n'.join(lines)+'\n')
              cp=subprocess.run(['ngspice','-b',str(path)],capture_output=True,text=True,timeout=30)
              log=(cp.stdout or '')+'\n'+(cp.stderr or '')
              (root/(name+'.log')).write_text(log)
              assert cp.returncode==0, (name,log[-2000:])
              ce=re.search(r'v\(ce\)\s*=\s*([+\-0-9.eE]+)',log,re.I)
              assert ce,(name,log[-2000:])
              value=float(ce.group(1))
              out.append({'case':name,'out_v':rail,'ce_v':value,'ideal_switch_model':True})
              print('NGSPICE_DC',name,'CE_V',value)
          m={x['case']:x['ce_v'] for x in out}
          assert abs(m['stock_host_z'])<1e-5
          assert m['new_host_z_low_rail']>1.4
          assert m['new_host_z_high_rail']<6
          assert m['new_MCU_permit']<0.4
          assert m['new_watchdog_fault_MCU_stuck_high']>1.4
          (root/'independent_results.json').write_text(json.dumps(out,indent=2)+'\n')
          print('ALL_INDEPENDENT_DC_GATES_PASS')
          PY
      - name: Save original Spice input and output including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g20-ngspice-independent-dc
          path: g20-results/
          retention-days: 30
          if-no-files-found: warn
