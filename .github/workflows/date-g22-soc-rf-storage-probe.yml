name: DATE G22 passive original serving x31 register storage probe
on:
  push:
    branches: [research/date-g22-independent-cpu-scope-20260920]
    paths: [.github/workflows/date-g22-soc-rf-storage-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rf-storage:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        rev: [parent, child]
        csr: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep exact original DUTs, add only passive physical RF SRAM readout
        shell: bash
        env:
          REV: ${{ matrix.rev }}
          CSR: ${{ matrix.csr }}
        run: |
          set -uo pipefail
          mkdir -p g22-probe
          git clone --filter=blob:none https://github.com/olofk/serv.git /tmp/g22-serving >g22-probe/CLONE.log 2>&1
          if [ "$REV" = parent ];then SHA=838d16615e81786062fae84b9f7c044fb8f6bbe4;else SHA=41e8aeedfd1e9ad5f95902c5b0dfc83d1c99e5d2;fi
          git -C /tmp/g22-serving checkout "$SHA" >g22-probe/CHECKOUT.log 2>&1
          git -C /tmp/g22-serving rev-parse HEAD >g22-probe/ORIGINAL_PIN.txt
          sha256sum /tmp/g22-serving/servile/servile_rf_mem_if.v /tmp/g22-serving/serving/serving.v >g22-probe/SOURCE_HASHES.txt
          cp research/date-g22-independent-cpu-scope-20260920/serving_soc_config_sweep_tb.v g22-probe/BASE_TESTBENCH.v
          python3 - <<'PY'
          from pathlib import Path
          p=Path('g22-probe/PROBE_TESTBENCH.v');s=Path('g22-probe/BASE_TESTBENCH.v').read_text()
          marker='      $display("SOC_FINAL csr=%0d target_x31=%08h control_x1=%08h cycles=%0d",CSR,target_data,ctrl_data,cycles);'
          assert s.count(marker)==1
          extra='''      $display("PASSIVE_PHYSICAL_X31_BYTE0=%02h index=8067",dut.ram.mem[8067]);
               $display("PASSIVE_PHYSICAL_X31_WORD_BYTES=%02h_%02h_%02h_%02h",dut.ram.mem[8064],dut.ram.mem[8065],dut.ram.mem[8066],dut.ram.mem[8067]);
               if (dut.ram.mem[8067] !== 8'h07) $fatal(1,"x31 raw SRAM did not contain 7");
          '''
          s=s.replace(marker,marker+'\n'+extra);p.write_text(s)
          PY
          /usr/bin/time -f 'compile_wall_s=%e' -o g22-probe/COMPILE_TIME.txt iverilog -g2012 -s serving_soc_config_sweep_tb -Pserving_soc_config_sweep_tb.CSR="$CSR" -D$(if [ "$REV" = parent ];then echo PARENT;else echo CHILD;fi) -o g22-probe/full_soc.vvp /tmp/g22-serving/rtl/*.v /tmp/g22-serving/servile/*.v /tmp/g22-serving/serving/*.v g22-probe/PROBE_TESTBENCH.v >g22-probe/COMPILE.log 2>&1
          rc=$?;echo "compile_exit=$rc" >g22-probe/STATUS.txt
          if [ "$rc" -eq 0 ];then timeout 95 /usr/bin/time -f 'sim_wall_s=%e' -o g22-probe/SIM_TIME.txt vvp g22-probe/full_soc.vvp >g22-probe/SIM.log 2>&1;rc=$?;echo "simulation_exit=$rc" >>g22-probe/STATUS.txt;else echo 'simulation_not_run=compile_error' >>g22-probe/STATUS.txt;fi
          grep -E 'SOC_FINAL|PASSIVE_PHYSICAL|G22_CONFIG|FATAL' g22-probe/SIM.log 2>/dev/null | tail -12 || true
          cat g22-probe/STATUS.txt
          exit 0
      - name: Archive full original-source passive probe and failed outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g22-rf-storage-${{ matrix.rev }}-csr${{ matrix.csr }}
          path: g22-probe/
          retention-days: 30
