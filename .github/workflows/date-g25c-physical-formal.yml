name: DATE G25C actual physical RTL symbolic proof boundary
on:
  push:
    branches: [research/date-g25-third-target-20260920]
    paths: [.github/workflows/date-g25c-physical-formal.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-physical:
    runs-on: ubuntu-22.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Original physical UART with symbolic byte, distinct BMC and cover
        shell: bash
        run: |
          set +e
          mkdir -p g25c-out g25c-work
          git clone --filter=blob:none https://github.com/ZipCPU/wbuart32.git /tmp/g25c-wbuart >g25c-out/CLONE.log 2>&1
          echo "clone_exit=$?" >g25c-out/STATUS.txt
          git -C /tmp/g25c-wbuart checkout d8ea86d1b8ef47d0b1c13f291a958b6aac9229f9 >g25c-out/CHECKOUT.log 2>&1
          echo "checkout_exit=$?" >>g25c-out/STATUS.txt
          git -C /tmp/g25c-wbuart rev-parse HEAD >g25c-out/ORIGINAL_COMMIT.txt
          cp /tmp/g25c-wbuart/rtl/{axiluart,ufifo,skidbuffer,txuart,rxuart}.v g25c-work/
          cp research/date-g25-third-target-20260920/g25_physical_formal_tb.sv g25c-work/
          cp research/date-g25-third-target-20260920/PHYSICAL_FORMAL_PREREGISTRATION.md g25c-out/
          sha256sum g25c-work/* >g25c-out/HASHES.txt
          { sby --version; yosys -V; z3 --version; iverilog -V 2>&1 | head -2; } >g25c-out/TOOLS.txt 2>&1
          iverilog -g2012 -s g25_physical_native_tb -o g25c-out/native.vvp g25c-work/{axiluart,ufifo,skidbuffer,txuart,rxuart}.v g25c-work/g25_physical_formal_tb.sv >g25c-out/NATIVE.compile.log 2>&1
          echo "native_compile_exit=$?" >>g25c-out/STATUS.txt
          if [ -f g25c-out/native.vvp ];then timeout 20 vvp g25c-out/native.vvp >g25c-out/NATIVE.run.log 2>&1;echo "native_run_exit=$?" >>g25c-out/STATUS.txt;fi
          ROOT="$PWD"
          for MODE in prove cover;do
            if [ "$MODE" = prove ];then OPTS='mode bmc'; DEFINE=; DEPTH=28;else OPTS='mode cover'; DEFINE='-DCOVER_ONLY'; DEPTH=26;fi
            cat >g25c-work/$MODE.sby <<EOF
          [options]
          $OPTS
          depth $DEPTH
          [engines]
          smtbmc z3
          [script]
          read_verilog -sv axiluart.v ufifo.v skidbuffer.v txuart.v rxuart.v
          read_verilog -formal -sv -DFORMAL_CHECK $DEFINE g25_physical_formal_tb.sv
          prep -top g25_physical_harness
          [files]
          axiluart.v
          ufifo.v
          skidbuffer.v
          txuart.v
          rxuart.v
          g25_physical_formal_tb.sv
          EOF
            (cd g25c-work && timeout 160 sby -f -d "$ROOT/g25c-out/$MODE-task" $MODE.sby >"$ROOT/g25c-out/$MODE.run.log" 2>&1)
            echo "${MODE}_exit=$? ${MODE}_status=$(cat g25c-out/$MODE-task/status 2>/dev/null || echo MISSING)" >>g25c-out/STATUS.txt
            cp g25c-work/$MODE.sby g25c-out/
          done
          cp g25c-work/g25_physical_formal_tb.sv g25c-out/
          cp g25c-work/axiluart.v g25c-out/
          cat g25c-out/STATUS.txt
          tail -12 g25c-out/NATIVE.run.log 2>/dev/null || true
          tail -10 g25c-out/prove.run.log 2>/dev/null || true
          tail -10 g25c-out/cover.run.log 2>/dev/null || true
      - name: Retain all positive negative and invalid original physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g25c-physical-original-raw
          path: g25c-out/
          retention-days: 30
