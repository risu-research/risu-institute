name: DATE G26 input-owned legal input versus retired output
on:
  push:
    branches: [research/date-g25-third-target-20260920]
    paths: [.github/workflows/date-g26-input-owned-legality.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        revision: [parent, child]
        op: [slli, srli, srai]
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain exact historical original RTL and original riscv-formal checker
        env:
          REV: ${{ matrix.revision }}
          OP: ${{ matrix.op }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "g26-out/$REV-$OP"
          git clone -q --filter=blob:none https://github.com/YosysHQ/riscv-formal.git /tmp/g26rvf
          git -C /tmp/g26rvf checkout -q c992aa61fdfe0846c5ed90324c596202a1c69b76
          git clone -q --filter=blob:none https://github.com/YosysHQ/picorv32.git /tmp/g26cpu
          SHA=b91af1c87e8bc4ae5b0b438c4ac04400a12b76fb
          if [ "$REV" = child ];then SHA=de92ce54e8a3f24f2adc6b5d04de35e4edb873e5;fi
          git -C /tmp/g26cpu show "$SHA:picorv32.v" >/tmp/g26rvf/cores/picorv32/picorv32.v
          git hash-object /tmp/g26rvf/cores/picorv32/picorv32.v >"g26-out/$REV-$OP/ORIGINAL_GIT_BLOB.txt"
          git -C /tmp/g26rvf rev-parse HEAD >"g26-out/$REV-$OP/FRAMEWORK_COMMIT.txt"
          sha256sum /tmp/g26rvf/cores/picorv32/picorv32.v >"g26-out/$REV-$OP/SOURCE_SHA256.txt"
          { yosys -V; sby --version; } >"g26-out/$REV-$OP/TOOLS.txt"
      - name: Keep actual PASS FAIL and UNKNOWN for all three frozen setups
        if: always()
        env:
          REV: ${{ matrix.revision }}
          OP: ${{ matrix.op }}
        shell: bash
        run: |
          set +e
          python3 research/date-g26-input-legality-20260920/g26_input_check.py >"g26-out/$REV-$OP/MATRIX_RUN.log" 2>&1
          echo "script_exit=$?" >"g26-out/$REV-$OP/EXIT.txt"
          tail -15 "g26-out/$REV-$OP/MATRIX_RUN.log"
          exit 0
      - name: Retain untouched failed and successful SBY artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g26-${{ matrix.revision }}-${{ matrix.op }}
          path: g26-out/
          retention-days: 30
