name: DATE QNN G3 Native MVE
on:
  push:
    branches: [research/date-qnn-g3-native-20260919]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-mve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS-NN
          ref: 22080c68d040c98139e6cb1549473e3149735f4d
          path: research/date-qnn-g3-native-20260919/upstream
          persist-credentials: false
      - name: Install QEMU Cortex-M55 and LLVM disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm llvm
          command -v llvm-objdump || ls /usr/bin/llvm-objdump*
      - name: Build and execute unchanged CMSIS-NN C through Arm MVE
        shell: bash
        working-directory: research/date-qnn-g3-native-20260919
        run: bash native/prepare_and_run.sh
      - name: Archive complete test and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-qnn-g3-mve-run
          path: |
            research/date-qnn-g3-native-20260919/results/
            research/date-qnn-g3-native-20260919/source/
          if-no-files-found: warn
