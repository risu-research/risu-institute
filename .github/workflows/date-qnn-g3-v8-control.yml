name: DATE QNN G3 CMSIS-NN v8 control
on:
  push:
    branches: [research/date-qnn-g3-v8-control-20260919]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v8-native-mve:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS-NN
          ref: 13c97dbb6f781d4aab38ed34e6e441f42b79aff4
          path: research/date-qnn-g3-native-20260919/upstream
          persist-credentials: false
      - name: Install Cortex-M55 emulator and disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm llvm
      - name: Rebuild upstream CMSIS-NN v8 and execute original scalar and MVE C
        shell: bash
        working-directory: research/date-qnn-g3-native-20260919
        run: bash native/prepare_v8_control.sh
      - name: Preserve both positive and negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-qnn-g3-v8-native-control
          path: |
            research/date-qnn-g3-native-20260919/results/v8/
            research/date-qnn-g3-native-20260919/source/
            research/date-qnn-g3-native-20260919/native/driver.c
            research/date-qnn-g3-native-20260919/native/prepare_v8_control.sh
          if-no-files-found: warn
