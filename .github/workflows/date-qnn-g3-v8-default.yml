name: DATE QNN v8 default-rounding negative control
on:
  push:
    branches: [research/date-qnn-g3-v8-default-control-20260919]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  default-rounding:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS-NN
          ref: 13c97dbb6f781d4aab38ed34e6e441f42b79aff4
          path: research/date-qnn-g3-native-20260919/upstream
          persist-credentials: false
      - name: Install Cortex-M55 emulator and disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm llvm
      - name: Execute original v8 MVE C without CMSIS_NN_USE_SINGLE_ROUNDING
        shell: bash
        working-directory: research/date-qnn-g3-native-20260919
        run: bash native/prepare_v8_default_rounding.sh
      - name: Preserve results and diagnostic failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-qnn-g3-v8-default-rounding
          path: |
            research/date-qnn-g3-native-20260919/results/v8_default/
            research/date-qnn-g3-native-20260919/source/
            research/date-qnn-g3-native-20260919/native/default_rounding_driver.c
            research/date-qnn-g3-native-20260919/native/prepare_v8_default_rounding.sh
          if-no-files-found: warn
