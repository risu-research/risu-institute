name: DATE QNN G4 public MoveNet native scalar MVE equivalence
on:
  push:
    branches: [research/date-qnn-g4-public-model-audit-20260919]
    paths:
      - '.github/workflows/date-qnn-g4-natural-mul-qemu.yml'
      - 'research/date-qnn-g4/natural_mul_driver.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS-NN
          ref: 13c97dbb6f781d4aab38ed34e6e441f42b79aff4
          path: research/date-qnn-g3-native-20260919/upstream
          persist-credentials: false
      - name: Install Cortex-M55 QEMU and LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm llvm
      - name: Extract unchanged v8 original kernel and compile public model parameters
        shell: bash
        run: |
          set -euo pipefail
          cd research/date-qnn-g3-native-20260919
          bash native/prepare_v8_control.sh
          mkdir -p results/natural
          C=clang
          FLAGS=(--target=thumbv8.1m.main-none-eabi -march=armv8.1-m.main+mve -mfloat-abi=hard -O1 -ffreestanding -fno-builtin -fno-unwind-tables -fno-asynchronous-unwind-tables -DCMSIS_NN_USE_SINGLE_ROUNDING -Isource/native_inc)
          "$C" "${FLAGS[@]}" -c ../date-qnn-g4/natural_mul_driver.c -o results/natural/driver.o
          "$C" "${FLAGS[@]}" -nostdlib -fuse-ld=lld -Wl,-T,native/an547.ld results/v8/{startup,scalar,mve}.o results/natural/driver.o -o results/natural/model_mul.elf
          llvm-objdump -d results/natural/model_mul.elf > results/natural/model_mul.disasm
          for ins in vshl.s32 vqdmulh.s32 vrshl.s32; do grep -Fq "$ins" results/natural/model_mul.disasm; done
          set +e
          timeout 75s qemu-system-arm -M mps3-an547 -cpu cortex-m55 -nographic -monitor none -serial none -semihosting-config enable=on,target=native -kernel results/natural/model_mul.elf > results/natural/qemu.log 2>&1
          rc=$?
          set -e
          cat results/natural/qemu.log
          printf 'QEMU_EXIT_CODE=%s\n' "$rc" | tee results/natural/qemu_exit.txt
          sha256sum results/v8/{startup,scalar,mve}.o results/natural/{driver.o,model_mul.elf} >results/natural/sha256.txt
          [[ $rc == 0 ]] && grep -Fqx 'NATURAL_MUL_QEMU_PASS' results/natural/qemu.log
          grep -Fqx 'NATURAL_MUL_TEST_ERRORS=0' results/natural/qemu.log
          for op in 87 117 120; do grep -Fq "NATURAL_MUL op=$op " results/natural/qemu.log; done
          echo NATURAL_MODEL_V8_ORIGINAL_QEMU_RUN_PASS
      - name: Preserve original source, executable, disassembly and full log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: date-qnn-g4-public-movenet-native-qemu
          path: |
            research/date-qnn-g4/natural_mul_driver.c
            research/date-qnn-g3-native-20260919/results/v8/
            research/date-qnn-g3-native-20260919/results/natural/
            research/date-qnn-g3-native-20260919/source/
          retention-days: 90
