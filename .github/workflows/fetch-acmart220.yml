name: Fetch official acmart 2.20 for FSE pixel comparison

on:
  push:
    branches:
      - research/fse-acmart220-pixel-compare-20260929
    paths:
      - .github/workflows/fetch-acmart220.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install minimal TeX for docstrip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base
      - name: Generate acmart.cls from official v2.20 release commit
        run: |
          set -euo pipefail
          RELEASE_COMMIT='10d6d082e522c4034022f38437019ba75589456b'
          curl -fsSL "https://raw.githubusercontent.com/borisveytsman/acmart/${RELEASE_COMMIT}/acmart.dtx" -o acmart.dtx
          curl -fsSL "https://raw.githubusercontent.com/borisveytsman/acmart/${RELEASE_COMMIT}/acmart.ins" -o acmart.ins
          latex -interaction=nonstopmode acmart.ins >/tmp/acmart-ins.log
          grep -F '[2026/08/16 v2.20 Typesetting articles for the Association for Computing Machinery]' acmart.cls
          sha256sum acmart.dtx acmart.ins acmart.cls | tee SHA256SUMS.txt
          printf 'official_release_commit=%s\n' "$RELEASE_COMMIT" > PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acmart-v2.20-official-release
          path: |
            acmart.cls
            SHA256SUMS.txt
            PROVENANCE.txt
          if-no-files-found: error
