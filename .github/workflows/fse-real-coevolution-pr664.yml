name: FSE real coevolution PR664

on:
  push:
    branches:
      - research/fse-goalpost-real-coevolution-20260926
    paths:
      - 'research/fse-goalpost-real-coevolution-20260926/candidate_pr664/**'
      - '.github/workflows/fse-real-coevolution-pr664.yml'
  workflow_dispatch:

jobs:
  four-way:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream-pinned verifier
        uses: dafny-lang/setup-dafny-action@v1.9.1
        with:
          dafny-version: '4.11.0'
      - name: Record verifier
        run: dafny --version
      - name: Run selective four-way replay
        shell: bash
        run: bash research/fse-goalpost-real-coevolution-20260926/candidate_pr664/run_matrix.sh
      - name: Print result
        if: always()
        run: |
          cat coevolution-results/pr664/matrix.tsv || true
          cat coevolution-results/pr664/RESULT.md || true
          for f in coevolution-results/pr664/B*/refinement.log; do echo "===== $f ====="; tail -80 "$f" || true; done
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fse-pr664-four-way-${{ github.run_id }}
          path: coevolution-results/pr664
          if-no-files-found: warn
