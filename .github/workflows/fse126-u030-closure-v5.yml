name: FSE126 U030 v5 closure

on:
  push:
    branches: ['research/fse126-u030-closure-v4-20260927']
    paths:
      - '.github/workflows/fse126-u030-closure-v5.yml'
      - 'research/fse126-census/run_u030_replay_v5.py'
      - 'research/fse126-census/INFRA_ERRATUM_U030_V4.md'
      - 'research/fse126-census/U030_V4_EXECUTION_FREEZE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dafny-lang/setup-dafny-action@v1.7.0
        with:
          dafny-version: '4.4.0'
      - name: Record runner and toolchain
        run: |
          mkdir -p out/U030-v5
          uname -a | tee out/U030-v5/runner-uname.txt
          git --version | tee out/U030-v5/git-version.txt
          dafny --version | tee out/U030-v5/dafny-version.txt
          python3 --version | tee out/U030-v5/python-version.txt
      - name: Execute frozen U030 v5 closure
        run: python3 research/fse126-census/run_u030_replay_v5.py
      - name: Show disposition and concise results
        if: always()
        run: |
          echo '=== DISPOSITION ==='
          cat out/U030-v5/DISPOSITION.txt 2>/dev/null || true
          echo '=== ENDPOINTS ==='
          cat out/U030-v5/endpoint_results.csv 2>/dev/null || true
          echo '=== FOUR-WAY ==='
          cat out/U030-v5/results.csv 2>/dev/null || true
          echo '=== SUBMODULE IDENTITY ==='
          cat out/U030-v5/submodule_identity.json 2>/dev/null || true
          echo '=== INFRA TRACE ==='
          cat out/U030-v5/INFRA_FAILURE.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fse126-U030-v5-closure-dafny-4.4.0
          path: out/U030-v5
          if-no-files-found: warn
          retention-days: 90
