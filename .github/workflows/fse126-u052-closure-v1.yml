name: FSE126 U052 closure v1

on:
  push:
    branches: ['research/fse126-u052-closure-20260927']
    paths:
      - '.github/workflows/fse126-u052-closure-v1.yml'
      - 'research/fse126-census/run_u052_closure_v1.py'
      - 'research/fse126-census/U052_CLOSURE_FREEZE_PRE_VERIFIER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dafny-lang/setup-dafny-action@v1.7.0
        with:
          dafny-version: '4.4.0'
      - name: Record runner and toolchain
        run: |
          mkdir -p out/U052-v1
          uname -a | tee out/U052-v1/runner-uname.txt
          git --version | tee out/U052-v1/git-version.txt
          dafny --version | tee out/U052-v1/dafny-version.txt
          python3 --version | tee out/U052-v1/python-version.txt
      - name: Execute frozen U052 closure
        run: python3 research/fse126-census/run_u052_closure_v1.py
      - name: Show disposition and evidence summary
        if: always()
        run: |
          echo '=== DISPOSITION ==='
          cat out/U052-v1/DISPOSITION.txt 2>/dev/null || true
          echo '=== ENDPOINTS ==='
          cat out/U052-v1/endpoint_results.csv 2>/dev/null || true
          echo '=== ISOLATION ==='
          cat out/U052-v1/isolation_certificate.json 2>/dev/null || true
          echo '=== DECLARATIONS ==='
          cat out/U052-v1/declaration_inventory.csv 2>/dev/null || true
          echo '=== INFRA TRACE ==='
          cat out/U052-v1/INFRA_FAILURE.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fse126-U052-v1-closure-dafny-4.4.0
          path: out/U052-v1
          if-no-files-found: warn
          retention-days: 90
