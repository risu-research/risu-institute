name: history-scan-vb

on:
  push:
    paths:
      - '.github/workflows/history-scan-vb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Clone public target history
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/vmware-labs/verified-betrfs.git repo.git
          git -C repo.git fsck --no-progress

      - name: Complete contract-diff history scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/patches
          git -C repo.git rev-list --all --count -- '*.dfy' > out/dfy_commits.txt
          git -C repo.git log --all --format='%H' -G'(requires|ensures|invariant|modifies|reads|decreases)' -- '*.dfy' \
            | awk 'NF' | sort -u > out/contract_commits.txt
          python3 - <<'PY'
          import csv, gzip, hashlib, os, re, subprocess
          from pathlib import Path

          repo = Path('repo.git')
          out = Path('out')
          patch_dir = out / 'patches'
          cre = re.compile(r'\b(requires|ensures|invariant|modifies|reads|decreases)\b')

          def git(*args, text=True):
              p = subprocess.run(['git','-C',str(repo),*args], stdout=subprocess.PIPE,
                                 stderr=subprocess.PIPE, check=True)
              return p.stdout.decode('utf-8','replace') if text else p.stdout

          shas = [x.strip() for x in (out/'contract_commits.txt').read_text().splitlines() if x.strip()]
          rows=[]
          root=0
          structural=0
          same_hunk=0
          same_hunk_2024=0

          for i, sha in enumerate(shas, 1):
              parents = git('rev-list','--parents','-n','1',sha).strip().split()
              if len(parents) < 2:
                  root += 1
                  continue
              parent = parents[1]
              date = git('show','-s','--format=%cs',sha).strip()
              subject = git('show','-s','--format=%s',sha).strip()
              patch_b = subprocess.run(
                  ['git','-C',str(repo),'diff','--no-ext-diff','--unified=3',parent,sha,'--','*.dfy'],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True).stdout
              patch = patch_b.decode('utf-8','replace')
              patch_hash = hashlib.sha256(patch_b).hexdigest()
              with gzip.open(patch_dir/f'{sha}.diff.gz','wb',compresslevel=9) as f:
                  f.write(patch_b)

              contract_lines = 0
              other_lines = 0
              h_contract=False
              h_other=False
              commit_same_hunk=False

              for line in patch.splitlines():
                  if line.startswith('@@'):
                      if h_contract and h_other:
                          commit_same_hunk=True
                      h_contract=h_other=False
                      continue
                  if not (line.startswith('+') or line.startswith('-')) or line.startswith('+++') or line.startswith('---'):
                      continue
                  s=line[1:].strip()
                  if not s:
                      continue
                  is_contract=bool(cre.search(s))
                  if is_contract:
                      contract_lines += 1
                      h_contract=True
                      continue
                  # Discovery-only broad substantive line: ignore comment-only and delimiter-only edits.
                  if s.startswith('//') or s.startswith('/*') or s.startswith('*') or s.startswith('*/'):
                      continue
                  if re.fullmatch(r'[{}();,]+', s):
                      continue
                  other_lines += 1
                  h_other=True
              if h_contract and h_other:
                  commit_same_hunk=True
              if other_lines > 0:
                  structural += 1
              if commit_same_hunk:
                  same_hunk += 1
                  if date >= '2024-01-01':
                      same_hunk_2024 += 1

              rows.append({
                  'repo':'vmware-labs/verified-betrfs','commit':sha,'parent':parent,'date':date,
                  'subject':subject,'contract_changed_lines':contract_lines,
                  'other_changed_lines':other_lines,'structural_candidate':int(other_lines>0),
                  'same_hunk_candidate':int(commit_same_hunk),'patch_sha256':patch_hash
              })
              if i % 250 == 0:
                  print(f'processed {i}/{len(shas)}')

          with (out/'verified_betrfs_candidates.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()) if rows else [
                  'repo','commit','parent','date','subject','contract_changed_lines','other_changed_lines',
                  'structural_candidate','same_hunk_candidate','patch_sha256'])
              w.writeheader(); w.writerows(rows)

          dfy_commits=int((out/'dfy_commits.txt').read_text().strip())
          with (out/'verified_betrfs_summary.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['repo','clone_status','scan_status','dfy_commits','contract_diff_commits',
                                           'processable_nonroot_rows','structural_candidates','same_hunk_candidates',
                                           'same_hunk_since_2024','root_contract_commits'])
              w.writerow(['vmware-labs/verified-betrfs','OK','OK',dfy_commits,len(shas),len(rows),structural,
                          same_hunk,same_hunk_2024,root])

          (out/'METHOD.md').write_text(
              '# verified-betrfs completion scan\n\n'
              'Public-compute rerun of the previously timed-out direct-history sensitivity arm.\n'
              'The target repository is mirrored and all refs are scanned with the same contract-token pickaxe:\n'
              '`git log --all -G(requires|ensures|invariant|modifies|reads|decreases) -- *.dfy`.\n\n'
              'Counts are discovery-audit counts only. They are not prevalence estimates and structural candidates are not adjudicated repairs.\n'
              'Candidate patches are preserved byte-for-byte (before gzip) with SHA-256 hashes.\n'
              'A broad substantive-line and same-hunk flag are included only as sensitivity diagnostics; they must not be interpreted as semantic co-repair labels.\n'
          )
          print((out/'verified_betrfs_summary.csv').read_text())
          PY
          sha256sum out/verified_betrfs_candidates.csv out/verified_betrfs_summary.csv out/contract_commits.txt out/dfy_commits.txt > out/SHA256SUMS.txt

      - name: Upload neutral scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-scan-vb
          path: out
          if-no-files-found: error
          retention-days: 7
