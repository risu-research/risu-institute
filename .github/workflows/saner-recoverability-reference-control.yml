name: SANER deterministic recoverability reference policy through real MCP
on:
  push:
    branches:
      - research/saner-original-mcp-202-204-20260921
    paths:
      - .github/workflows/saner-recoverability-reference-control.yml
permissions:
  contents: read
jobs:
  reference-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ivo-toby/mcp-openapi-server
          ref: 5cc37bc4df8de5bf1d1327a1017dcfd1d2165f3f
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build exact original source
        working-directory: upstream
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          npm ci --no-audit --no-fund
          npm run build
      - name: Run deterministic reference over original MCP tools and synthetic API
        env:
          REFERENCE_POLICY: '1'
          REPEATS: '2'
        run: |
          set -euxo pipefail
          cp harness/research/saner-original-mcp-202-204-20260921/recovery_boundary.mjs upstream/recovery_boundary.mjs
          python harness/research/saner-original-mcp-202-204-20260921/fix_recovery_tool_names.py
          python harness/research/saner-original-mcp-202-204-20260921/add_deterministic_reference_policy.py
          cd upstream
          node recovery_boundary.mjs | tee ../reference_policy_run.log
      - name: Save all raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saner-deterministic-reference-control-evidence
          if-no-files-found: warn
          path: |
            recovery_boundary_results.json
            reference_policy_run.log
