name: Temporary Agent Closure Browser E2E

on:
  push:
    branches:
      - agent-closure-browser-local

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-closure-browser-local
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install temporary Chromium harness
        run: |
          pnpm add -D playwright@1.55.0 --lockfile=false
          pnpm exec playwright install --with-deps chromium
      - name: Exercise browser-local privacy and file flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const artifact = JSON.parse(readFileSync('public/tools/agent-closure/cases/c7-false-success.json', 'utf8'));
          writeFileSync('.tmp/c7-bundle.json', JSON.stringify(artifact.bundle, null, 2) + '\n');
          writeFileSync('.tmp/oversized.json', `"${'x'.repeat(1024 * 1024)}"\n`);
          NODE
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 >.tmp/wrangler.log 2>&1 &
          echo $! > .tmp/wrangler.pid
          cleanup() { kill "$(cat .tmp/wrangler.pid)" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8787/tools/agent-closure-inspector/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://localhost:8787/tools/agent-closure-inspector/ >/dev/null
          cat > .tmp/e2e.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const network = [];
          const diagnostics = [];

          page.on('console', (message) => diagnostics.push(`console ${message.type()}: ${message.text()}`));
          page.on('pageerror', (error) => diagnostics.push(`pageerror: ${error.stack || error.message}`));
          page.on('requestfailed', (request) => diagnostics.push(`requestfailed: ${request.method()} ${request.url()} ${request.failure()?.errorText || ''}`));
          page.on('request', (request) => {
            network.push({ url: request.url(), method: request.method(), postData: request.postData() });
          });

          await page.goto('http://localhost:8787/tools/agent-closure-inspector/', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => {
            const button = document.getElementById('open-file');
            const note = document.getElementById('capability-note');
            return button && !button.disabled && button.textContent === 'Open local evidence' && note?.textContent?.includes('Evaluated in this browser');
          });

          const button = page.locator('#open-file');
          assert.equal(await button.isEnabled(), true);

          const oversizedChooserPromise = page.waitForEvent('filechooser');
          await button.click();
          const oversizedChooser = await oversizedChooserPromise;
          await oversizedChooser.setFiles('.tmp/oversized.json');
          await page.waitForFunction(() => document.getElementById('capability-note')?.textContent?.includes('exceeds the 1 MiB browser-local limit'));
          assert.match(await page.locator('#privacy-note').innerText(), /not uploaded or read into the evaluator/i);
          assert.equal(await page.locator('#inspector').evaluate((node) => node.classList.contains('hidden')), true);
          assert.equal(network.filter(({ url }) => new URL(url).pathname === '/api/evaluate').length, 0);

          const validChooserPromise = page.waitForEvent('filechooser');
          await button.click();
          const validChooser = await validChooserPromise;
          await validChooser.setFiles('.tmp/c7-bundle.json');

          await page.waitForFunction(() => {
            const inspector = document.getElementById('inspector');
            const verdict = document.getElementById('verdict-strip');
            return inspector && !inspector.classList.contains('hidden') && verdict?.textContent?.includes('INCOMPLETE');
          }, null, { timeout: 10000 });

          assert.match(await page.locator('#verdict-strip').innerText(), /INCOMPLETE/);
          assert.match(await page.locator('#privacy-note').innerText(), /Evidence stays on this device/);
          assert.deepEqual(
            network.filter(({ url }) => new URL(url).pathname === '/api/evaluate'),
            [],
          );

          const direct = await page.request.post('http://localhost:8787/api/evaluate', {
            headers: { 'content-type': 'application/json' },
            data: {},
          });
          assert.ok([404, 405].includes(direct.status()), `unexpected origin API status ${direct.status()}`);

          assert.deepEqual(
            diagnostics.filter((line) => line.startsWith('pageerror:') || line.startsWith('requestfailed:')),
            [],
          );
          console.log('E2E PASS: oversized file blocked before evaluation, valid C7 rendered INCOMPLETE, /api/evaluate network requests = 0.');
          await browser.close();
          NODE
          node .tmp/e2e.mjs
