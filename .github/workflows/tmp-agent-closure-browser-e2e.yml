name: Temporary Agent Closure Browser E2E

on:
  push:
    branches:
      - agent-closure-browser-local

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-closure-browser-local
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install temporary Chromium harness
        run: |
          pnpm add -D playwright@1.55.0 --lockfile=false
          pnpm exec playwright install --with-deps chromium
      - name: Diagnose and exercise real browser-local file flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const artifact = JSON.parse(readFileSync('public/tools/agent-closure/cases/c7-false-success.json', 'utf8'));
          writeFileSync('.tmp/c7-bundle.json', JSON.stringify(artifact.bundle, null, 2) + '\n');
          NODE
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 >.tmp/wrangler.log 2>&1 &
          echo $! > .tmp/wrangler.pid
          cleanup() { kill "$(cat .tmp/wrangler.pid)" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8787/tools/agent-closure-inspector/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://localhost:8787/tools/agent-closure-inspector/ >/dev/null
          echo '--- worker headers ---'
          curl -sS -D - -o /dev/null http://localhost:8787/tools/agent-closure-inspector/evaluator-worker.js
          echo '--- bootstrap headers ---'
          curl -sS -D - -o /dev/null http://localhost:8787/tools/agent-closure-inspector/browser-local.js
          cat > .tmp/e2e.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const network = [];
          const diagnostics = [];
          page.on('console', (message) => diagnostics.push(`console ${message.type()}: ${message.text()}`));
          page.on('pageerror', (error) => diagnostics.push(`pageerror: ${error.stack || error.message}`));
          page.on('requestfailed', (request) => diagnostics.push(`requestfailed: ${request.method()} ${request.url()} ${request.failure()?.errorText || ''}`));
          page.on('request', (request) => {
            network.push({ url: request.url(), method: request.method(), postData: request.postData() });
          });
          page.on('response', (response) => {
            const path = new URL(response.url()).pathname;
            if (path.endsWith('/browser-local.js') || path.endsWith('/evaluator-worker.js')) {
              diagnostics.push(`response: ${response.status()} ${path} content-type=${response.headers()['content-type'] || ''}`);
            }
          });

          await page.goto('http://localhost:8787/tools/agent-closure-inspector/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(5000);
          const state = await page.evaluate(() => ({
            buttonDisabled: document.getElementById('open-file')?.disabled,
            buttonText: document.getElementById('open-file')?.textContent,
            capability: document.getElementById('capability-note')?.textContent,
            privacy: document.getElementById('privacy-note')?.textContent,
            workerType: typeof Worker,
            fetchSource: String(window.fetch).slice(0, 220),
            currentOrigin: window.location.origin,
          }));
          console.log('BROWSER STATE', JSON.stringify(state, null, 2));
          console.log('BROWSER DIAGNOSTICS\n' + diagnostics.join('\n'));
          console.log('RELEVANT NETWORK\n' + network.filter(({url}) => /agent-closure|api\/evaluate/.test(url)).map((x) => `${x.method} ${x.url}`).join('\n'));

          const workerAsset = await page.request.get('http://localhost:8787/tools/agent-closure-inspector/evaluator-worker.js');
          console.log('WORKER ASSET', workerAsset.status(), workerAsset.headers()['content-type'], (await workerAsset.text()).slice(0, 140));

          assert.equal(state.workerType, 'function');
          assert.equal(state.buttonDisabled, false, `button not enabled: ${JSON.stringify(state)}`);
          assert.match(state.capability || '', /Evaluated in this browser/);

          const button = page.locator('#open-file');
          const chooserPromise = page.waitForEvent('filechooser');
          await button.click();
          const chooser = await chooserPromise;
          await chooser.setFiles('.tmp/c7-bundle.json');

          await page.waitForFunction(() => {
            const inspector = document.getElementById('inspector');
            const verdict = document.getElementById('verdict-strip');
            return inspector && !inspector.classList.contains('hidden') && verdict?.textContent?.includes('INCOMPLETE');
          }, null, { timeout: 10000 });

          const verdict = await page.locator('#verdict-strip').innerText();
          assert.match(verdict, /INCOMPLETE/);
          assert.match(await page.locator('#privacy-note').innerText(), /Evidence stays on this device/);

          const evaluationRequests = network.filter(({ url }) => new URL(url).pathname === '/api/evaluate');
          assert.deepEqual(evaluationRequests, []);

          const direct = await page.request.post('http://localhost:8787/api/evaluate', {
            headers: { 'content-type': 'application/json' },
            data: {},
          });
          assert.ok([404, 405].includes(direct.status()), `unexpected origin API status ${direct.status()}`);

          console.log('E2E PASS: button enabled, file chooser opened, C7 rendered INCOMPLETE, /api/evaluate network requests = 0.');
          await browser.close();
          NODE
          node .tmp/e2e.mjs
