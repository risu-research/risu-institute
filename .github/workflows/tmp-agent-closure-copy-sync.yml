name: Temporary Agent Closure Copy Sync
on:
  push:
    branches: [agent-closure-browser-local-copy-sync]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-closure-browser-local-copy-sync
      - name: Apply exact copy sync
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/sync.py
          python /tmp/sync.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/work/bounded-agent-closure/index.html tests/bounded-agent-closure-work-page.test.mjs
          git diff --cached --check
          git commit -m 'Sync Agent Closure browser-local capability copy'
          git push origin HEAD:agent-closure-browser-local-copy-sync
