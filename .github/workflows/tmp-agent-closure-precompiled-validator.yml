name: Temporary Agent Closure Precompiled Validator Build

on:
  push:
    branches:
      - agent-closure-browser-local

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: agent-closure-browser-local

      - name: Checkout frozen engine
        uses: actions/checkout@v4
        with:
          repository: risu-research/bounded-agent-closure
          ref: a46456f028cd3dd1d386111b1faab890a26ae5e9
          path: .tmp/bac-engine

      - name: Checkout frozen Inspector presentation
        uses: actions/checkout@v4
        with:
          repository: risu-research/bounded-agent-closure
          ref: 07325dd1304cc3fe1acd86ce50596161581a1cdb
          path: .tmp/bac-inspector

      - name: Rebuild browser evaluator with precompiled schema validator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .tmp/bac-engine rev-parse HEAD)" = "a46456f028cd3dd1d386111b1faab890a26ae5e9"
          test "$(git -C .tmp/bac-inspector rev-parse HEAD)" = "07325dd1304cc3fe1acd86ce50596161581a1cdb"
          npm ci --prefix .tmp/bac-engine
          npm install --prefix .tmp/bac-engine --no-save --package-lock=false esbuild@0.25.9 @noble/hashes@1.8.0
          mkdir -p .tmp/browser-build
          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import Ajv2020 from './.tmp/bac-engine/node_modules/ajv/dist/2020.js';
          import standaloneCode from './.tmp/bac-engine/node_modules/ajv/dist/standalone/index.js';

          const engineCommit = 'a46456f028cd3dd1d386111b1faab890a26ae5e9';
          const inspectorCommit = '07325dd1304cc3fe1acd86ce50596161581a1cdb';
          const verifyPath = '.tmp/bac-engine/src/verify-closure.mjs';
          const presentationPath = '.tmp/bac-inspector/inspector/presentation.mjs';
          const schemaPath = '.tmp/bac-engine/schemas/closure-evidence.schema.json';
          const verify = readFileSync(verifyPath, 'utf8');
          const presentation = readFileSync(presentationPath, 'utf8');
          const schemaText = readFileSync(schemaPath, 'utf8');
          const schema = JSON.parse(schemaText);
          const sha256 = (text) => createHash('sha256').update(text).digest('hex');

          const ajv = new Ajv2020({
            allErrors: true,
            strict: true,
            code: { source: true, esm: true, optimize: true },
          });
          const validate = ajv.compile(schema);
          const validatorCode = standaloneCode(ajv, validate);
          writeFileSync('.tmp/bac-engine/src/validate-schema.browser.mjs', validatorCode);

          const header = 'import { readFileSync } from "node:fs";\nimport Ajv2020 from "ajv/dist/2020.js";\nimport { canonicalStringify, sha256Digest } from "./canonicalize.mjs";';
          if (!verify.startsWith(header)) throw new Error('Frozen verifier header changed unexpectedly');
          const schemaBlock = 'const schema = JSON.parse(\n  readFileSync(new URL("../schemas/closure-evidence.schema.json", import.meta.url), "utf8"),\n);\nconst validateSchema = new Ajv2020({ allErrors: true, strict: true }).compile(schema);';
          if (!verify.includes(schemaBlock)) throw new Error('Frozen verifier schema compiler changed unexpectedly');

          const transformed = verify
            .replace(
              header,
              'import validateSchema from "./validate-schema.browser.mjs";\nimport { canonicalStringify, sha256Digest } from "./canonicalize-browser.mjs";',
            )
            .replace(schemaBlock, '');
          writeFileSync('.tmp/bac-engine/src/verify-closure.browser.mjs', transformed);

          writeFileSync('.tmp/bac-engine/src/canonicalize-browser.mjs', `import { sha256 } from "@noble/hashes/sha256";\nimport { bytesToHex } from "@noble/hashes/utils";\n\nexport function canonicalize(value) {\n  if (Array.isArray(value)) return value.map(canonicalize);\n  if (value !== null && typeof value === "object") {\n    return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]));\n  }\n  return value;\n}\n\nexport function canonicalStringify(value) {\n  return JSON.stringify(canonicalize(value));\n}\n\nexport function sha256Digest(value) {\n  const bytes = new TextEncoder().encode(canonicalStringify(value));\n  return \`sha256:\${bytesToHex(sha256(bytes))}\`;\n}\n`);

          writeFileSync('.tmp/browser-build/entry.mjs', `import { verifyClosure } from "../bac-engine/src/verify-closure.browser.mjs";\nimport { presentEvaluation, presentParseError } from "../bac-inspector/inspector/presentation.mjs";\n\nconst MAX_BODY_BYTES = 1024 * 1024;\nfunction result(status, body) { return { status, body }; }\nfunction evaluateRequest({ method, contentType, raw }) {\n  if (method !== "POST") return result(405, { runner_state: "REQUEST_ERROR", error: { code: "METHOD_NOT_ALLOWED" } });\n  if (String(contentType ?? "").split(";", 1)[0].trim().toLowerCase() !== "application/json") {\n    return result(415, { runner_state: "REQUEST_ERROR", error: { code: "UNSUPPORTED_MEDIA_TYPE" } });\n  }\n  if (new TextEncoder().encode(String(raw ?? "")).byteLength > MAX_BODY_BYTES) {\n    const message = "Request body exceeds 1 MiB.";\n    return result(413, { runner_state: "PARSE_ERROR", presentation: presentParseError("REQUEST_BODY_TOO_LARGE", message) });\n  }\n  let bundle;\n  try { bundle = JSON.parse(String(raw ?? "")); }\n  catch (error) {\n    return result(400, { runner_state: "PARSE_ERROR", presentation: presentParseError("MALFORMED_JSON", error.message) });\n  }\n  const evaluation = verifyClosure(bundle);\n  return result(200, { evaluation, presentation: presentEvaluation(bundle, evaluation) });\n}\nself.addEventListener("message", (event) => {\n  const message = event.data ?? {};\n  if (message.type !== "evaluate" || typeof message.id !== "string") return;\n  try {\n    const response = evaluateRequest(message.request ?? {});\n    self.postMessage({ type: "result", id: message.id, ...response });\n  } catch {\n    self.postMessage({ type: "result", id: message.id, status: 500, body: { runner_state: "REQUEST_ERROR", error: { code: "INTERNAL_WORKER_ERROR" } } });\n  }\n});\nself.postMessage({ type: "ready" });\n`);

          const provenancePath = 'public/tools/agent-closure-inspector/evaluator-provenance.json';
          const provenance = JSON.parse(readFileSync(provenancePath, 'utf8'));
          provenance.purpose = 'Ephemeral Web Worker adapter for the frozen BAC verifier with a build-time precompiled frozen JSON Schema validator. Private evidence is passed by browser memory message, not HTTP.';
          provenance.verifier_source_sha256 = sha256(verify);
          provenance.presentation_source_sha256 = sha256(presentation);
          provenance.schema_source_sha256 = sha256(schemaText);
          provenance.schema_validator_mode = 'Ajv standalone precompiled at build time';
          provenance.dynamic_code_generation = false;
          provenance.worker_sha256 = null;
          writeFileSync(provenancePath, JSON.stringify(provenance, null, 2) + '\n');
          NODE

          ./.tmp/bac-engine/node_modules/.bin/esbuild .tmp/browser-build/entry.mjs \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2022 \
            --legal-comments=none \
            --banner:js='/* Generated browser-local evaluator. Frozen BAC engine a46456f028cd3dd1d386111b1faab890a26ae5e9; Inspector presentation 07325dd1304cc3fe1acd86ce50596161581a1cdb; schema validator precompiled at build time. */' \
            --outfile=public/tools/agent-closure-inspector/evaluator-worker.js

          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'public/tools/agent-closure-inspector/evaluator-provenance.json';
          const provenance = JSON.parse(readFileSync(path, 'utf8'));
          const worker = readFileSync('public/tools/agent-closure-inspector/evaluator-worker.js');
          const text = worker.toString('utf8');
          if (/\bnew Function\b|\beval\s*\(/u.test(text)) {
            throw new Error('Generated worker still contains dynamic code generation');
          }
          provenance.worker_sha256 = createHash('sha256').update(worker).digest('hex');
          writeFileSync(path, JSON.stringify(provenance, null, 2) + '\n');
          NODE

          rm -rf .tmp
          git add public/tools/agent-closure-inspector/evaluator-worker.js public/tools/agent-closure-inspector/evaluator-provenance.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Precompile Agent Closure browser schema validator"
          git push origin HEAD:agent-closure-browser-local
