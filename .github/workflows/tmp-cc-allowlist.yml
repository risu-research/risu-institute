name: Temporary Consequence Closure Allowlist
on:
  push:
    branches:
      - consequence-closure-current-inspector
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consequence-closure-current-inspector
      - name: Add exact public allowlist entries
        run: |
          python -c 'from pathlib import Path; p=Path("tests/release-integrity.test.mjs"); t=p.read_text(); n="    \"tools/consequence-closure/index.html\",\n"; a="    \"tools/consequence-closure/current/app.js\",\n    \"tools/consequence-closure/current/index.html\",\n    \"tools/consequence-closure/current/provenance.json\",\n    \"tools/consequence-closure/current/styles.css\",\n    \"tools/consequence-closure/current/worker.js\",\n"; assert n in t and "tools/consequence-closure/current/app.js" not in t; p.write_text(t.replace(n,a+n,1))'
      - name: Commit clean allowlist update
        run: |
          rm .github/workflows/tmp-cc-allowlist.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/release-integrity.test.mjs .github/workflows/tmp-cc-allowlist.yml
          git diff --cached --check
          git commit -m "Register current Consequence Closure public assets"
          git push origin HEAD:consequence-closure-current-inspector
