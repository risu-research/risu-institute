name: Temporary Consequence Closure Polish
on:
  push:
    branches:
      - consequence-closure-current-inspector
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consequence-closure-current-inspector
      - name: Apply precision patch
        run: python .tmp/cc-polish.py
      - name: Commit clean result
        run: |
          rm .tmp/cc-polish.py .github/workflows/tmp-cc-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/tools/consequence-closure/current/app.js .tmp/cc-polish.py .github/workflows/tmp-cc-polish.yml
          git diff --cached --check
          git commit -m "Polish Consequence Closure comparison and deep links"
          git push origin HEAD:consequence-closure-current-inspector
