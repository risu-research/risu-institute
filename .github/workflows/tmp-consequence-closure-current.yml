name: Temporary Consequence Closure Current Surface
on:
  push:
    branches: [consequence-closure-current-inspector]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consequence-closure-current-inspector
      - name: Install current surface and patch discovery paths
        shell: bash
        run: |
          cat > /tmp/cc-payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/cc-payload.b64 > /tmp/cc-payload.tar.gz
          tar -xzf /tmp/cc-payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          headers = Path('public/_headers')
          text = headers.read_text(encoding='utf-8')
          marker = '/tools/consequence-closure/current/*'
          block = """

/tools/consequence-closure/current/*
  Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'none'
  Referrer-Policy: no-referrer
  Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
  Cross-Origin-Opener-Policy: same-origin
  Cross-Origin-Resource-Policy: same-origin
  X-Robots-Tag: noindex, nofollow
  Cache-Control: no-store
"""
          if marker in text:
              raise SystemExit('current Consequence Closure header block already exists')
          headers.write_text(text.rstrip() + block, encoding='utf-8')

          tools = Path('public/tools/index.html')
          text = tools.read_text(encoding='utf-8')
          old = '<article class="rv-other-card"><h3>Consequence Closure Inspector</h3><p>Inspect bounded consequence closure and the semantic obligations required by an action.</p><a href="/tools/consequence-closure/">Open Inspector →</a></article>'
          new = '<article class="rv-other-card"><h3>Consequence Closure Inspector</h3><p>Inspect bounded consequence closure and the semantic obligations required by an action.</p><a href="/tools/consequence-closure/current/">Launch Inspector →</a> · <a href="/tools/consequence-closure/">About &amp; archive</a></article>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Consequence Closure tools card, found {text.count(old)}')
          tools.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public tests
          git diff --cached --check
          git commit -m "Add current Consequence Closure Inspector surface"
          git push origin HEAD:consequence-closure-current-inspector
