name: Temporary Consequence Closure Recovery 3

on:
  push:
    branches:
      - consequence-closure-current-inspector

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consequence-closure-current-inspector
      - name: Assemble staged payload
        shell: bash
        run: |
          cat .tmp/cc-payload.part00 .tmp/cc-payload.part01 .tmp/cc-payload.part02 .tmp/cc-payload.part03 .tmp/cc-payload.part04 .tmp/cc-payload.part05 | base64 -d > /tmp/cc-payload.tar.gz
          tar -xzf /tmp/cc-payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          headers = Path('public/_headers')
          text = headers.read_text(encoding='utf-8')
          route = '/tools/consequence-closure/current/*'
          if route not in text:
              lines = ['', route, "  Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'none'", '  Referrer-Policy: no-referrer', '  Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()', '  Cross-Origin-Opener-Policy: same-origin', '  Cross-Origin-Resource-Policy: same-origin', '  X-Robots-Tag: noindex, nofollow', '  Cache-Control: no-store']
              headers.write_text(text.rstrip() + '\n'.join(lines) + '\n', encoding='utf-8')
          tools = Path('public/tools/index.html')
          text = tools.read_text(encoding='utf-8')
          old = '<article class="rv-other-card"><h3>Consequence Closure Inspector</h3><p>Inspect bounded consequence closure and the semantic obligations required by an action.</p><a href="/tools/consequence-closure/">Open Inspector →</a></article>'
          new = '<article class="rv-other-card"><h3>Consequence Closure Inspector</h3><p>Inspect bounded consequence closure and the semantic obligations required by an action.</p><a href="/tools/consequence-closure/current/">Launch Inspector →</a> · <a href="/tools/consequence-closure/">About &amp; archive</a></article>'
          if old in text:
              tools.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Consequence Closure tools card did not match expected source')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public tests
          git diff --cached --check
          git commit -m "Add current Consequence Closure Inspector surface"
          git push origin HEAD:consequence-closure-current-inspector
