name: Temporary RISU Verify Workbench finalizer

on:
  push:
    branches: [risu-verify-workbench-polish]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: risu-verify-workbench-polish
          fetch-depth: 0
      - name: Harden scoped selectors, refresh CSP pins, and add regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          html_path = Path('public/tools/index.html')
          h = html_path.read_text()

          old = '.rv-case b{display:block;font-size:.78rem}.rv-case span{display:block;color:var(--rv-muted);font-size:.7rem;margin-top:2px}'
          new = '.rv-case>span:last-child{display:block;min-width:0}.rv-case b{display:block;font-size:.78rem}.rv-case>span:last-child>span{display:block;color:var(--rv-muted);font-size:.7rem;margin-top:2px}'
          if h.count(old) != 1:
              raise SystemExit(f'expected one broad case selector block, found {h.count(old)}')
          h = h.replace(old, new)
          html_path.write_text(h)

          styles = re.findall(r'<style>([\s\S]*?)</style>', h)
          if len(styles) != 2:
              raise SystemExit(f'expected two inline style blocks, found {len(styles)}')
          hashes = [base64.b64encode(hashlib.sha256(s.encode()).digest()).decode() for s in styles]

          headers_path = Path('public/_headers')
          hdr = headers_path.read_text()
          block_match = re.search(r'(?ms)^/tools/\n(?P<body>(?:  .*\n)+)', hdr)
          if not block_match:
              raise SystemExit('missing /tools/ header block')
          block = block_match.group(0)
          new_style = "style-src 'self' " + ' '.join(f"'sha256-{x}'" for x in hashes)
          replaced, n = re.subn(r"style-src 'self'(?: 'sha256-[^']+')+", new_style, block, count=1)
          if n != 1:
              raise SystemExit(f'expected one style-src hash list in /tools/ block, found {n}')
          hdr = hdr[:block_match.start()] + replaced + hdr[block_match.end():]
          headers_path.write_text(hdr)

          test_path = Path('tests/risu-verify-workbench.test.mjs')
          t = test_path.read_text()
          marker = 'test("Workbench verification rail keeps nested content out of layout selectors"'
          if marker not in t:
              t += '''\n\ntest("Workbench verification rail keeps nested content out of layout selectors",async()=>{const h=await read("public/tools/index.html");for(const x of [".rv-accepted>div{display:grid",".rv-accepted>div>div{min-width:0}",".rv-accepted>div>div>b{display:block",".rv-accepted>div>div>span{display:block",".rv-case>span:last-child>span{display:block"])assert.ok(h.includes(x),x);assert.doesNotMatch(h,/\\.rv-accepted div\\{display:grid/u);assert.doesNotMatch(h,/\\.rv-accepted span\\{display:block/u);assert.doesNotMatch(h,/\\.rv-case span\\{display:block/u);});\n'''
              test_path.write_text(t)
          PY
      - name: Remove temporary workflow and commit exact changes
        run: |
          rm .github/workflows/tmp-risu-verify-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/tools/index.html public/_headers tests/risu-verify-workbench.test.mjs .github/workflows/tmp-risu-verify-finalize.yml
          git diff --cached --check
          git commit -m 'Harden RISU Verify Workbench responsive layout'
          git push origin HEAD:risu-verify-workbench-polish
